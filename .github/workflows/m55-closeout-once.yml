name: M55 closeout historical witness repair

on:
  push:
    branches: [agent/m55-ahci-sata-foundation]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m55-ahci-sata-foundation
          fetch-depth: 0
      - name: Restore immutable M54 version witness
        shell: bash
        run: |
          set -euo pipefail
          before='Active version after runtime-neutral closeout: **BoringKernel 0.0.56-dev**. No M55 implementation is included.'
          after='Active version after runtime-neutral closeout: **BoringKernel 0.0.55-dev**. No M55 implementation is included.'
          grep -Fqx "$before" docs/roadmap.md
          python3 -c 'from pathlib import Path; p=Path("docs/roadmap.md"); s=p.read_text(); old="Active version after runtime-neutral closeout: **BoringKernel 0.0.56-dev**. No M55 implementation is included."; new="Active version after runtime-neutral closeout: **BoringKernel 0.0.55-dev**. No M55 implementation is included."; assert s.count(old)==1; p.write_text(s.replace(old,new))'
          grep -Fqx "$after" docs/roadmap.md
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/roadmap.md
          git commit -m 'M55: restore historical M54 version witness'
          git push origin HEAD:agent/m55-ahci-sata-foundation
