name: M58 version-witness closeout helper

on:
  push:
    branches:
      - agent/m58-high-memory-pmm

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/m58-high-memory-pmm
          fetch-depth: 0

      - name: Align only established active version witnesses
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          expected_counts = {
              'kernel/core/boringfs_ro_test.c': 1,
              'kernel/core/entry.c': 1,
              'kernel/core/syscall.c': 1,
              'tests/block-device-qemu.sh': 1,
              'tests/boot-qemu.sh': 1,
              'tests/boringfetch-host-test.c': 1,
              'tests/boringfs-ro-qemu.sh': 1,
              'tests/boringfs-rw-qemu.sh': 1,
              'tests/console-qemu.sh': 1,
              'tests/elf-qemu.sh': 1,
              'tests/exception-divide-qemu.sh': 1,
              'tests/exception-pagefault-qemu.sh': 1,
              'tests/framebuffer-qemu.sh': 1,
              'tests/init-qemu.sh': 1,
              'tests/m36-spawn-qemu.sh': 1,
              'tests/m48-xhci-qemu.sh': 1,
              'tests/m49-xhci-address-qemu.sh': 1,
              'tests/m52-xhci-hid-qemu.sh': 1,
              'tests/m53-usb-input-qemu.sh': 1,
              'tests/m55-ahci-qemu.sh': 1,
              'tests/m56-ahci-readonly-qemu.sh': 1,
              'tests/persistent-root-qemu.sh': 3,
              'tests/ramfs-qemu.sh': 1,
              'tests/ring3-qemu.sh': 1,
              'tests/runtime-qemu.sh': 1,
              'tests/shell-host-test.c': 1,
              'tests/shell-qemu.sh': 2,
              'tests/syscall-qemu.sh': 1,
              'tests/validate-m36-terminal-screenshot.py': 1,
              'tests/vfs-qemu.sh': 1,
              'tests/virtio-block-qemu.sh': 1,
          }

          old = '0.0.58-dev'
          new = '0.0.59-dev'
          for name, expected in expected_counts.items():
              path = Path(name)
              text = path.read_text()
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f'{name}: expected {expected} active {old} witness(es), found {actual}')
              path.write_text(text.replace(old, new))

          changed = set()
          for line in subprocess.check_output(['git', 'status', '--short'], text=True).splitlines():
              if line:
                  changed.add(line[3:])
          if changed != set(expected_counts):
              raise SystemExit(f'unexpected version-witness path set: {sorted(changed)}')
          PY
          git diff --check

      - name: Remove one-shot helper and commit final closeout correction
        shell: bash
        run: |
          git rm .github/workflows/m58-version-witness-closeout.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kernel/core/boringfs_ro_test.c kernel/core/entry.c kernel/core/syscall.c tests
          git diff --cached --check
          git commit -m 'M58: align closeout version witnesses'
          git push origin HEAD:agent/m58-high-memory-pmm
