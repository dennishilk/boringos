name: M36 source snapshot transport

on:
  push:
    branches: [agent/native-boring-terminal]
  workflow_dispatch:

jobs:
  source-snapshot:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact feature head
        uses: actions/checkout@v4

      - name: Archive tracked source at exact HEAD
        run: git archive --format=tar.gz --output=m36-source-snapshot.tar.gz HEAD

      - name: Upload exact source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: m36-source-snapshot
          path: m36-source-snapshot.tar.gz
          if-no-files-found: error
