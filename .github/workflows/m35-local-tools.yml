name: M35 temporary portable QEMU tooling
on:
  pull_request:
    paths:
      - .github/workflows/m35-local-tools.yml
  workflow_dispatch:
jobs:
  tooling:
    runs-on: ubuntu-22.04
    steps:
      - name: Prepare portable local diagnostic tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 xorriso
          mkdir -p portable/usr/bin portable/usr/share
          cp /usr/bin/qemu-system-x86_64 /usr/bin/xorriso portable/usr/bin/
          mkdir -p portable/usr/lib/x86_64-linux-gnu
          cp -a /usr/lib/x86_64-linux-gnu/qemu portable/usr/lib/x86_64-linux-gnu/
          ldd /usr/bin/qemu-system-x86_64 /usr/bin/xorriso /usr/lib/x86_64-linux-gnu/qemu/*.so | awk '$2 == "=>" {print $3}' | sort -u > libraries.txt
          printf '%s\n' /lib64/ld-linux-x86-64.so.2 >> libraries.txt
          while read -r library; do
            mkdir -p "portable$(dirname "$library")"
            cp -L "$library" "portable$library"
          done < libraries.txt
          for directory in qemu seabios ipxe; do
            if [ -d "/usr/share/$directory" ]; then cp -a "/usr/share/$directory" portable/usr/share/; fi
          done
          tar -czf m35-portable-qemu.tar.gz -C portable .
          sha256sum m35-portable-qemu.tar.gz > m35-portable-qemu.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: m35-temporary-local-qemu-tools
          path: |
            m35-portable-qemu.tar.gz
            m35-portable-qemu.sha256
          retention-days: 3
