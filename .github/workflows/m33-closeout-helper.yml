name: M33 temporary closeout helper

on:
  push:
    branches:
      - agent/native-ipc-service-foundation
    paths:
      - tools/m33_closeout_v3.py
      - .github/workflows/m33-closeout-helper.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-ipc-service-foundation
          fetch-depth: 0
      - name: Apply input-neutral M33 closeout
        run: |
          python3 tools/m33_closeout_v3.py
          git diff --check
      - name: Commit closeout changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kernel/core/entry.c kernel/core/syscall.c kernel/core/boringfs_ro_test.c tests/boot-qemu.sh tests/framebuffer-qemu.sh tests/block-device-qemu.sh tests/boringfs-ro-qemu.sh tests/boringfs-rw-qemu.sh tests/console-qemu.sh tests/elf-qemu.sh tests/exception-divide-qemu.sh tests/exception-pagefault-qemu.sh tests/init-qemu.sh tests/persistent-root-qemu.sh tests/ramfs-qemu.sh tests/ring3-qemu.sh tests/runtime-qemu.sh tests/shell-host-test.c tests/shell-qemu.sh tests/syscall-qemu.sh tests/vfs-qemu.sh tests/virtio-block-qemu.sh README.md README.de.md docs/ipc.md docs/roadmap.md
          git commit -m 'Close out Milestone 33 at 0.0.34-dev'
          git push origin HEAD:agent/native-ipc-service-foundation
