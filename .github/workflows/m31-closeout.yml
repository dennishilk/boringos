name: M31 closeout transport

on:
  push:
    branches:
      - agent/native-input-foundation

permissions:
  contents: write

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact M31 branch
        uses: actions/checkout@v4
        with:
          ref: agent/native-input-foundation
          fetch-depth: 0

      - name: Verify freeze ancestry and apply input-neutral closeout
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 065fa085ee7534012037e9eab9b3cfbdcacec39e HEAD
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/m31-closeout.py')
          text = path.read_text()
          old = '    return [line for line in proc.stdout.splitlines() if line]\n'
          new = ('    return [line for line in proc.stdout.splitlines() if line '
                 'and not line.startswith("tests/m31-closeout.py:") '
                 'and not line.startswith(".github/workflows/m31-closeout.yml:")]\n')
          if text.count(old) != 1:
              raise SystemExit('closeout grep filter anchor mismatch')
          text = text.replace(old, new, 1)
          old = ('    if count != 1:\n'
                 '        raise SystemExit(f"{path}: expected exactly one closeout anchor, found {count}")\n'
                 '    p.write_text(text.replace(old, new, 1))\n')
          new = ('    if path == "docs/roadmap.md" and old.startswith("The accepted development banner is now:"):\n'
                 '        marker = "# Stage 1 — memory foundations"\n'
                 '        if marker not in text:\n'
                 '            raise SystemExit("docs/roadmap.md: current-state boundary missing")\n'
                 '        current, historical = text.split(marker, 1)\n'
                 '        if current.count(old) != 1:\n'
                 '            raise SystemExit(f"docs/roadmap.md: expected one current banner anchor, found {current.count(old)}")\n'
                 '        p.write_text(current.replace(old, new, 1) + marker + historical)\n'
                 '        return\n'
                 '    if count != 1:\n'
                 '        raise SystemExit(f"{path}: expected exactly one closeout anchor, found {count}")\n'
                 '    p.write_text(text.replace(old, new, 1))\n')
          if text.count(old) != 1:
              raise SystemExit('closeout replace_once guard anchor mismatch')
          path.write_text(text.replace(old, new, 1))
          PY
          python3 tests/m31-closeout.py
          git checkout -- tests/m31-closeout.py
          git diff --check
          echo '--- closeout diff stat ---'
          git diff --stat
          echo '--- remaining historical 0.0.31-dev ---'
          git grep -n '0.0.31-dev' -- . ':(exclude)tests/m31-closeout.py' ':(exclude).github/workflows/m31-closeout.yml' || true
          echo '--- active 0.0.32-dev contracts ---'
          git grep -n '0.0.32-dev' -- . ':(exclude)tests/m31-closeout.py' ':(exclude).github/workflows/m31-closeout.yml'

      - name: Commit closeout only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md README.de.md docs kernel tests
          git diff --cached --check
          git diff --cached --quiet && { echo 'no closeout changes produced' >&2; exit 1; }
          git commit -m 'Close out Milestone 31 documentation and version'
          git push origin HEAD:agent/native-input-foundation
