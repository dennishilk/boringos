name: Temporary M67 diagnostic

on:
  push:
    branches:
      - agent/m67-m69-input-display-polish

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m67-m69-input-display-polish
      - name: Add narrow typematic witnesses
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('kernel/core/input.c')
          s = p.read_text()
          old = '#include <boring/timer.h>\n'
          new = '#include <boring/timer.h>\n#if defined(BORING_M54_USB_ONLY_DESKTOP)\n#include <boring/serial.h>\n#endif\n'
          if new not in s:
              if old not in s:
                  raise SystemExit('input include anchor missing')
              s = s.replace(old, new, 1)

          old = '    } else if ((!down) && (input_state.repeat_key == code)) {\n        input_clear_repeat();\n    }\n'
          new = '    } else if ((!down) && (input_state.repeat_key == code)) {\n#if defined(BORING_M54_USB_ONLY_DESKTOP)\n        serial_write_string("M67_REPEAT_KEY_UP\\\\n");\n#endif\n        input_clear_repeat();\n    }\n'
          if new not in s:
              if old not in s:
                  raise SystemExit('keyup anchor missing')
              s = s.replace(old, new, 1)

          old = '    event.type = BORING_INPUT_EVENT_KEY;\n    event.code = input_state.repeat_key;\n'
          new = '#if defined(BORING_M54_USB_ONLY_DESKTOP)\n    serial_write_string("M67_REPEAT_DUE\\\\n");\n#endif\n    event.type = BORING_INPUT_EVENT_KEY;\n    event.code = input_state.repeat_key;\n'
          if new not in s:
              if old not in s:
                  raise SystemExit('repeat anchor missing')
              s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('tests/m54-usb-only-desktop-qemu.py')
          s = p.read_text()
          old = '            time.sleep(0.85)\n            qmp("input-send-event", {"events": [\n                QMP["key_event"]("backspace", False)]})\n'
          new = '            time.sleep(0.85)\n            due_before_up = text().count("M67_REPEAT_DUE")\n            print(f"M67 diagnostic due_before_up={due_before_up}")\n            qmp("input-send-event", {"events": [\n                QMP["key_event"]("backspace", False)]})\n'
          if new not in s:
              if old not in s:
                  raise SystemExit('harness hold anchor missing')
              s = s.replace(old, new, 1)
          old = '                    "M67 held Backspace did not delete multiple characters: "\n                    f"before={before_suffix!r} after={after_suffix!r}")\n'
          new = '                    "M67 held Backspace did not delete multiple characters: "\n                    f"before={before_suffix!r} after={after_suffix!r} "\n                    f"due_before_up={due_before_up} "\n                    f"repeat_key_up={text().count(chr(77)+chr(54)+chr(55)+chr(95)+chr(82)+chr(69)+chr(80)+chr(69)+chr(65)+chr(84)+chr(95)+chr(75)+chr(69)+chr(89)+chr(95)+chr(85)+chr(80))}")\n'
          if new not in s:
              if old not in s:
                  raise SystemExit('harness error anchor missing')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kernel/core/input.c tests/m54-usb-only-desktop-qemu.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'diag: witness M67 repeat generation'
          git push origin HEAD:agent/m67-m69-input-display-polish
