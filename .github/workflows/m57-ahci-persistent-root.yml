name: M57 writable AHCI persistent root

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ahci-persistence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install focused QEMU dependencies
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 xorriso
      - name: Writable IDENTIFY FIS bounds and cache fixtures
        run: |
          mkdir -p build
          cc -Ikernel/include -std=c11 -fno-builtin \
            -Wall -Wextra -Wpedantic -Werror -Wconversion -Wshadow \
            -Wstrict-prototypes -Wmissing-prototypes \
            tests/ahci-block-host-test.c kernel/core/ahci_block.c \
            -o build/ahci-block-host-test
          ./build/ahci-block-host-test
      - name: ASAN and UBSAN writable AHCI fixtures
        run: |
          cc -Ikernel/include -std=c11 -fno-builtin \
            -Wall -Wextra -Wpedantic -Werror -Wconversion -Wshadow \
            -Wstrict-prototypes -Wmissing-prototypes \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/ahci-block-host-test.c kernel/core/ahci_block.c \
            -o build/ahci-block-host-test-sanitized
          ASAN_OPTIONS=detect_leaks=0 ./build/ahci-block-host-test-sanitized
      - name: Real q35 WRITE DMA flush and reboot persistence
        run: ./tests/m57-ahci-persistence-qemu.sh
      - name: AHCI-root USB-only desktop mutation and reboot
        run: ./tests/m57-ahci-persistent-root-qemu.py
