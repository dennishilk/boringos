name: Temporary M67 cleanup

on:
  push:
    branches:
      - agent/m67-m69-input-display-polish

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m67-m69-input-display-polish
      - name: Finalize clean M67 QEMU acceptance
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('kernel/core/input.c')
          s = p.read_text()
          s = s.replace('#include <boring/timer.h>\n#if defined(BORING_M54_USB_ONLY_DESKTOP)\n#include <boring/serial.h>\n#endif\n', '#include <boring/timer.h>\n', 1)
          s = s.replace('    } else if ((!down) && (input_state.repeat_key == code)) {\n#if defined(BORING_M54_USB_ONLY_DESKTOP)\n        serial_write_string("M67_REPEAT_KEY_UP\\\\n");\n#endif\n        input_clear_repeat();\n    }\n', '    } else if ((!down) && (input_state.repeat_key == code)) {\n        input_clear_repeat();\n    }\n', 1)
          s = s.replace('#if defined(BORING_M54_USB_ONLY_DESKTOP)\n    serial_write_string("M67_REPEAT_DUE\\\\n");\n#endif\n    event.type = BORING_INPUT_EVENT_KEY;\n    event.code = input_state.repeat_key;\n', '    event.type = BORING_INPUT_EVENT_KEY;\n    event.code = input_state.repeat_key;\n', 1)
          p.write_text(s)

          p = Path('kernel/core/event_syscall.c')
          s = p.read_text()
          s = s.replace('#include <boring/task.h>\n#include <boring/timer.h>\n#include <boring/vmm.h>\n', '#include <boring/task.h>\n#include <boring/vmm.h>\n', 1)
          s = s.replace('    size_t index;\n    long ready = 0L;\n    /* Service due typematic work at every canonical event poll. */\n    if (boring_input_repeat_tick(timer_ticks())) {\n        boring_event_input_irq();\n    }\n    for (index = 0U; index < count; ++index) {\n', '    size_t index;\n    long ready = 0L;\n    for (index = 0U; index < count; ++index) {\n', 1)
          p.write_text(s)

          p = Path('tests/m54-usb-only-desktop-qemu.py')
          s = p.read_text()
          s = s.replace('            time.sleep(0.85)\n            due_before_up = text().count("M67_REPEAT_DUE")\n            print(f"M67 diagnostic due_before_up={due_before_up}")\n            qmp("input-send-event", {"events": [\n', '            time.sleep(1.25)\n            qmp("input-send-event", {"events": [\n', 1)
          old = '                    "M67 held Backspace did not delete multiple characters: "\n                    f"before={before_suffix!r} after={after_suffix!r} "\n                    f"due_before_up={due_before_up} "\n                    f"repeat_key_up={text().count(chr(77)+chr(54)+chr(55)+chr(95)+chr(82)+chr(69)+chr(80)+chr(69)+chr(65)+chr(84)+chr(95)+chr(75)+chr(69)+chr(89)+chr(95)+chr(85)+chr(80))}")\n'
          new = '                    "M67 held Backspace did not delete multiple characters: "\n                    f"before={before_suffix!r} after={after_suffix!r}")\n'
          s = s.replace(old, new, 1)
          old = '            for _ in after_suffix:\n                key("backspace")\n            cleared = prompt_suffix(\n                decode_terminal("m67-cleared-line", prompt)[terminal_a])\n'
          new = '            for remaining in range(len(after_suffix) - 1, -1, -1):\n                key("backspace")\n                wait_prompt_suffix(\n                    "m67-clear-line", prompt, terminal_a,\n                    lambda value, expected=remaining: len(value) == expected,\n                    f"cleanup length {remaining}")\n            cleared = prompt_suffix(\n                decode_terminal("m67-cleared-line", prompt)[terminal_a])\n'
          if old not in s:
              raise SystemExit('cleanup anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kernel/core/input.c kernel/core/event_syscall.c tests/m54-usb-only-desktop-qemu.py
          git diff --check
          git commit -m 'M67: stabilize held-key QEMU acceptance'
          git push origin HEAD:agent/m67-m69-input-display-polish
