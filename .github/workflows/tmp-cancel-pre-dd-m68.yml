name: Temporary cancel pre-dd M68 run

on:
  push:
    branches: [agent/m67-m69-input-display-polish]

permissions:
  actions: write
  contents: read

jobs:
  cancel-pre-dd-run:
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel superseded M68 run before historical dd step
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/34045919319/cancel
          echo 'SUPERSEDED_M68_CANCEL_REQUESTED=YES'
