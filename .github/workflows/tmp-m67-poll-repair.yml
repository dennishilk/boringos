name: Temporary M67 poll repair

on:
  push:
    branches: [agent/m67-m69-input-display-polish]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m67-m69-input-display-polish
      - name: Apply transport-neutral repeat poll servicing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('kernel/core/event_syscall.c')
          s = p.read_text()
          inc = '#include <boring/task.h>\n#include <boring/timer.h>\n#include <boring/vmm.h>\n'
          if inc not in s:
              old = '#include <boring/task.h>\n#include <boring/vmm.h>\n'
              if old not in s:
                  raise SystemExit('timer include anchor missing')
              s = s.replace(old, inc, 1)
          old = (
              '    size_t index;\n'
              '    long ready = 0L;\n'
              '    for (index = 0U; index < count; ++index) {\n'
          )
          new = (
              '    size_t index;\n'
              '    long ready = 0L;\n'
              '    /* Service due typematic work at every canonical event poll. */\n'
              '    if (boring_input_repeat_tick(timer_ticks())) {\n'
              '        boring_event_input_irq();\n'
              '    }\n'
              '    for (index = 0U; index < count; ++index) {\n'
          )
          if new not in s:
              if old not in s:
                  raise SystemExit('poll anchor missing')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kernel/core/event_syscall.c
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'M67: service due repeat work during event polling'
          git push origin HEAD:agent/m67-m69-input-display-polish
