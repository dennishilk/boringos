name: M31 integration patch

on:
  push:
    branches:
      - agent/native-input-foundation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-input-foundation
          fetch-depth: 0
      - name: Apply bounded M31 integration edits
        run: |
          python3 tests/m31-integrate.py
          git diff --check
      - name: Commit integration result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Makefile .github/workflows/boot-test.yml kernel user tests/boringfs-fixture.c tests/input-host-test.c
          git commit -m 'Integrate native input through IRQ and Ring 3'
          git push origin HEAD:agent/native-input-foundation
