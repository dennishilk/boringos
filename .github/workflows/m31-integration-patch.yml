name: M31 focused proof

on:
  push:
    branches:
      - agent/native-input-foundation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-input-foundation
          fetch-depth: 0
      - name: Fix CPL3 input test declaration once
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('kernel/core/syscall_test.c')
          text = path.read_text()
          marker = '#include <boring/input.h>\n'
          if marker not in text:
              anchor = '#include <boring/exception.h>\n'
              if anchor not in text:
                  raise SystemExit('syscall_test.c include anchor missing')
              path.write_text(text.replace(anchor, anchor + marker, 1))
          PY
          git diff --check
          if ! git diff --quiet -- kernel/core/syscall_test.c; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add kernel/core/syscall_test.c
            git commit -m 'Fix M31 syscall input test declaration'
            git push origin HEAD:agent/native-input-foundation
          fi
      - name: Install focused build and QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils curl xorriso qemu-system-x86
      - name: Build kernel
        run: make kernel
      - name: Native input decoder and queue host tests
        run: make input-host-test
      - name: Standalone input-test ELF audit
        run: sh ./tests/input-test-build-audit.sh
      - name: Existing CPL3 syscall acceptance plus M31 negatives
        run: sh ./tests/syscall-qemu.sh
      - name: Real PS/2 keyboard and mouse userspace input
        run: sh ./tests/input-qemu.sh
      - name: Persistent BoringFS root regression
        run: sh ./tests/persistent-root-qemu.sh
      - name: Descriptor and cat regression
        run: sh ./tests/fd-stdio-qemu.sh
      - name: Framebuffer regression
        run: sh ./tests/framebuffer-qemu.sh
