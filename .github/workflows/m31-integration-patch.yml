name: M31 integration patch

on:
  push:
    branches: [agent/native-input-foundation]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-input-foundation
          fetch-depth: 0
      - name: Apply bounded M31 integration edits
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {actual}: {old[:80]!r}")
              p.write_text(text.replace(old, new, count))

          # Input core waiter state used by blocking INPUT_READ.
          replace('kernel/include/boring/input.h',
                  '    bool owned;\n    bool initialized;\n',
                  '    bool owned;\n    bool waiting;\n    bool initialized;\n')
          replace('kernel/include/boring/input.h',
                  'bool boring_input_submit_key(uint32_t code, bool down);\n',
                  'bool boring_input_wait_prepare(uint64_t pid);\nvoid boring_input_wait_cancel(uint64_t pid);\nbool boring_input_submit_key(uint32_t code, bool down);\n')
          replace('kernel/core/input.c',
                  '    bool owned;\n    bool initialized;\n',
                  '    bool owned;\n    bool owner_waiting;\n    bool initialized;\n')
          replace('kernel/core/input.c',
                  '    ++input_state.count;\n    return true;\n',
                  '    ++input_state.count;\n    input_state.owner_waiting = false;\n    return true;\n')
          replace('kernel/core/input.c',
                  '    input_state.owned = false;\n    input_state.initialized = true;\n',
                  '    input_state.owned = false;\n    input_state.owner_waiting = false;\n    input_state.initialized = true;\n')
          replace('kernel/core/input.c',
                  '        input_state.owner_pid = pid;\n        input_clear_queue();\n',
                  '        input_state.owner_pid = pid;\n        input_state.owner_waiting = false;\n        input_clear_queue();\n')
          replace('kernel/core/input.c',
                  '        input_state.owner_pid = 0ULL;\n        input_clear_queue();\n',
                  '        input_state.owner_pid = 0ULL;\n        input_state.owner_waiting = false;\n        input_clear_queue();\n', count=2)
          anchor = '''bool boring_input_submit_key(uint32_t code, bool down) {\n'''
          waiter = '''bool boring_input_wait_prepare(uint64_t pid) {\n    const bool interrupts_were_enabled = x86_64_interrupts_enabled();\n    bool prepared = false;\n\n    x86_64_interrupts_disable();\n    if (input_state.initialized && input_state.owned &&\n        (input_state.owner_pid == pid) && (input_state.count == 0U)) {\n        input_state.owner_waiting = true;\n        prepared = true;\n    }\n    input_restore_interrupts(interrupts_were_enabled);\n    return prepared;\n}\n\nvoid boring_input_wait_cancel(uint64_t pid) {\n    const bool interrupts_were_enabled = x86_64_interrupts_enabled();\n\n    x86_64_interrupts_disable();\n    if (input_state.initialized && input_state.owned &&\n        (input_state.owner_pid == pid)) {\n        input_state.owner_waiting = false;\n    }\n    input_restore_interrupts(interrupts_were_enabled);\n}\n\n'''
          replace('kernel/core/input.c', anchor, waiter + anchor)
          replace('kernel/core/input.c',
                  '    stats->owned = input_state.owned;\n    stats->initialized = input_state.initialized;\n',
                  '    stats->owned = input_state.owned;\n    stats->waiting = input_state.owner_waiting;\n    stats->initialized = input_state.initialized;\n')

          # Avoid rereading the controller config after keyboard scanning is live.
          replace('kernel/arch/x86_64/i8042.c',
                  '''    if (!i8042_read_config(&config)) {\n        keyboard_online = false;\n        mouse_online = false;\n        (void)i8042_write_command((uint8_t)I8042_COMMAND_DISABLE_KEYBOARD);\n        (void)i8042_write_command((uint8_t)I8042_COMMAND_DISABLE_MOUSE);\n        *state = active_state;\n        return false;\n    }\n    config = (uint8_t)(config | (uint8_t)I8042_CONFIG_TRANSLATION);\n''',
                  '''    config = (uint8_t)(config | (uint8_t)I8042_CONFIG_TRANSLATION);\n''')

          # Native syscall integration: use existing user-range and copy helpers.
          replace('kernel/core/syscall.c',
                  '#include <boring/heap.h>\n',
                  '#include <boring/heap.h>\n#include <boring/input.h>\n')
          syscall_anchor = '''static uint64_t syscall_getcwd(uint64_t user_buffer, uint64_t capacity) {\n'''
          syscall_input = r'''static int syscall_input_error(enum boring_input_result result) {
    switch (result) {
        case BORING_INPUT_RESULT_OK:
            return 0;
        case BORING_INPUT_RESULT_BUSY:
            return BORING_SYSCALL_EBUSY;
        case BORING_INPUT_RESULT_ACCESS:
            return BORING_SYSCALL_EACCES;
        case BORING_INPUT_RESULT_INVALID:
            return BORING_SYSCALL_EINVAL;
        case BORING_INPUT_RESULT_NOT_INITIALIZED:
        default:
            return BORING_SYSCALL_EIO;
    }
}

static uint64_t syscall_input_claim(void) {
    struct process *const process = process_current();
    enum boring_input_result result;

    if ((process == NULL) || !process_is_alive(process)) {
        return syscall_error(BORING_SYSCALL_EINVAL);
    }
    result = boring_input_claim(process->pid);
    if (result != BORING_INPUT_RESULT_OK) {
        return syscall_error(syscall_input_error(result));
    }
    serial_write_string("boring-input: claim pid ");
    serial_write_u64(process->pid);
    serial_write_string("\n");
    return 0ULL;
}

static uint64_t syscall_input_read(uint64_t user_events, uint64_t max_events) {
    struct boring_input_event events[BORING_INPUT_READ_MAX];
    struct process *const process = process_current();
    size_t safe_max;
    size_t bytes;
    size_t count;
    enum boring_input_result result;
    bool copied;

    if ((max_events == 0ULL) ||
        (max_events > (uint64_t)BORING_INPUT_READ_MAX) ||
        (max_events > (uint64_t)SIZE_MAX) || (process == NULL) ||
        !process_is_alive(process)) {
        return syscall_error(BORING_SYSCALL_EINVAL);
    }
    safe_max = (size_t)max_events;
    bytes = safe_max * sizeof(struct boring_input_event);
    if (!syscall_user_range_accessible((uintptr_t)user_events, bytes, true)) {
        return syscall_error(BORING_SYSCALL_EFAULT);
    }

    for (;;) {
        count = 0U;
        x86_64_interrupts_disable();
        result = boring_input_read(process->pid, events, safe_max, &count);
        if (result != BORING_INPUT_RESULT_OK) {
            return syscall_error(syscall_input_error(result));
        }
        if (count != 0U) {
            break;
        }
        if (!boring_input_wait_prepare(process->pid)) {
            return syscall_error(BORING_SYSCALL_EIO);
        }
        /*
         * STI+HLT closes the empty-queue/sleep race on the current single-CPU
         * target: a pending IRQ is delivered before or immediately after HLT.
         * The global SYSCALL stack remains owned by this process throughout.
         */
        x86_64_enable_and_halt();
        x86_64_interrupts_disable();
        boring_input_wait_cancel(process->pid);
    }

    /* User copies are deliberately outside the IRQ-disabled queue section. */
    x86_64_interrupts_enable();
    copied = syscall_copy_to_user((uintptr_t)user_events, events,
                                  count * sizeof(struct boring_input_event));
    x86_64_interrupts_disable();
    if (!copied) {
        return syscall_error(BORING_SYSCALL_EFAULT);
    }
    return (uint64_t)count;
}

static uint64_t syscall_input_release(void) {
    struct process *const process = process_current();
    enum boring_input_result result;

    if ((process == NULL) || !process_is_alive(process)) {
        return syscall_error(BORING_SYSCALL_EINVAL);
    }
    result = boring_input_release(process->pid);
    if (result != BORING_INPUT_RESULT_OK) {
        return syscall_error(syscall_input_error(result));
    }
    serial_write_string("boring-input: release pid ");
    serial_write_u64(process->pid);
    serial_write_string("\n");
    return 0ULL;
}

'''
          replace('kernel/core/syscall.c', syscall_anchor, syscall_input + syscall_anchor)
          replace('kernel/core/syscall.c',
