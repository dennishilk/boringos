          replace('tests/boringfs-fixture.c',
                  '''    } else if (cat_size != 0U) {\n        return false;\n    }\n\n    if (volume_size''',
                  '''    } else if (cat_size != 0U) {\n        return false;\n    }\n    if (have_input_test) {\n        if (!fixture_program_blocks(input_test_size, INPUT_TEST_BLOCK0,\n                                    &input_test_blocks)) {\n            return false;\n        }\n    } else if (input_test_size != 0U) {\n        return false;\n    }\n\n    if (volume_size''')
          replace('tests/boringfs-fixture.c',
