name: M51 runtime-neutral closeout helper

on:
  push:
    branches: [agent/m51-usb-hid-endpoint-setup]
    paths: [.github/workflows/m51-closeout-helper.yml]

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m51-usb-hid-endpoint-setup
          fetch-depth: 3
      - name: Verify exact freeze-documentation anchor
        run: |
          test "$(git rev-parse HEAD^)" = "8713592672401e6bb2956a8ad36211b47acd71bd"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/m51-closeout-helper.yml"
      - name: Apply bounded version closeout
        shell: bash
        run: |
          files='README.de.md README.md kernel/core/boringfs_ro_test.c kernel/core/entry.c kernel/core/syscall.c tests/block-device-qemu.sh tests/boot-qemu.sh tests/boringfetch-host-test.c tests/boringfs-ro-qemu.sh tests/boringfs-rw-qemu.sh tests/console-qemu.sh tests/elf-qemu.sh tests/exception-divide-qemu.sh tests/exception-pagefault-qemu.sh tests/framebuffer-qemu.sh tests/init-qemu.sh tests/m36-spawn-qemu.sh tests/m48-xhci-qemu.sh tests/m49-xhci-address-qemu.sh tests/persistent-root-qemu.sh tests/ramfs-qemu.sh tests/ring3-qemu.sh tests/runtime-qemu.sh tests/shell-host-test.c tests/shell-qemu.sh tests/syscall-qemu.sh tests/validate-m36-terminal-screenshot.py tests/vfs-qemu.sh tests/virtio-block-qemu.sh'
          count=0
          for f in $files; do
            grep -q '0\.0\.51-dev' "$f"
            sed -i 's/0\.0\.51-dev/0.0.52-dev/g' "$f"
            count=$((count + 1))
          done
          test "$count" -eq 29
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/roadmap.md')
          s = p.read_text()
          old = 'The accepted development banner is now:\n\n```text\nBoringKernel 0.0.51-dev\n```'
          new = 'The accepted development banner is now:\n\n```text\nBoringKernel 0.0.52-dev\n```'
          if s.count(old) != 1:
              raise SystemExit('roadmap active banner is not uniquely 0.0.51-dev')
          if '## Milestone 51: bounded USB device configuration and HID endpoint setup' in s:
              raise SystemExit('M51 roadmap section already present')
          s = s.replace(old, new, 1)
          s += '''\n\n## Milestone 51: bounded USB device configuration and HID endpoint setup — COMPLETE, Semantic Frozen\n\nM51 takes M50 descriptors_ready direct xHCI root-port devices through real standard SET_CONFIGURATION and real Configure Endpoint for descriptor-derived HID Interrupt-IN endpoints. Endpoint address/DCI, maximum packet size, polling interval and configuration value come from validated descriptor data; PMM-owned rings and 32/64-byte xHCI contexts remain bounded. No HID report transfers, input-queue delivery, hubs, storage or M52 work are included.\n\nSemantic Freeze: `67bf133ecd8c849bd7e3e3b4793b1efcafbf7700`, tree `6413aab58139db5c35739e68510a39b71634db50`. Real acceptance proved two dynamically discovered devices, two SET_CONFIGURATION completions, two Configure Endpoint completions and ten real Transfer Events. Observed ports/slots/endpoints/intervals are evidence only. Full inherited M37–M51 plus Boot #572 were SUCCESS before freeze.\n\nActive version after runtime-neutral closeout: **BoringKernel 0.0.52-dev**. No M52 implementation is included.\nSee [m51-usb-hid-endpoint-setup.md](m51-usb-hid-endpoint-setup.md).\n'''
          p.write_text(s)

          p = Path('docs/m51-usb-hid-endpoint-setup.md')
          s = p.read_text()
          marker = 'Active version after runtime-neutral closeout: **BoringKernel 0.0.52-dev**.'
          if marker in s:
              raise SystemExit('M51 closeout marker already present')
          p.write_text(s + '\n\n' + marker + '\nNo M52 implementation is included.\n')
          PY
          git rm .github/workflows/m51-closeout-helper.yml
          expected=$(printf '%s\n' .github/workflows/m51-closeout-helper.yml docs/m51-usb-hid-endpoint-setup.md docs/roadmap.md $files | sort)
          actual=$(git diff HEAD --name-only | sort)
          test "$actual" = "$expected"
          git diff --check HEAD
      - name: Commit runtime-neutral closeout
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'M51: runtime-neutral closeout and advance version'
          git push origin HEAD:agent/m51-usb-hid-endpoint-setup
