    }
    frame_release(device->descriptor_buffer_physical);
'''
          if text.count(old) != 1:
              raise SystemExit('arch release marker')
          text = text.replace(old, new, 1)
          marker = '''static bool descriptor_buffer_bytes(struct xhci_addressed_device *device,
                                    uint8_t **bytes) {
    void *virtual_address = NULL;
    if ((device == NULL) || (bytes == NULL) ||
        (device->descriptor_buffer_physical == 0ULL) ||
