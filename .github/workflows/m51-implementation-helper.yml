name: M51 bounded implementation helper

on:
  push:
    branches: [agent/m51-usb-hid-endpoint-setup]
    paths: [.github/workflows/m51-implementation-helper.yml]

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m51-usb-hid-endpoint-setup
          fetch-depth: 5
      - name: Verify exact transport head
        run: |
          test "$(git rev-parse HEAD^)" = "7b2a5d0751a53e74e987b37861401a3e9fee81f2"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/m51-implementation-helper.yml"
          test -f .github/m51-implement.py
      - name: Apply and compile bounded M51
        run: |
          python3 .github/m51-implement.py
          chmod +x tests/m51-xhci-configuration-qemu.sh
          make xhci-host-test
          git rm .github/workflows/m51-implementation-helper.yml .github/m51-implement.py
          git diff --check HEAD
      - name: Commit M51 implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'M51: configure bounded USB HID endpoints'
          git push origin HEAD:agent/m51-usb-hid-endpoint-setup
