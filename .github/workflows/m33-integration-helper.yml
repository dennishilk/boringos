name: M33 temporary integration helper

on:
  workflow_dispatch:
  push:
    branches:
      - agent/native-ipc-service-foundation
    paths:
      - tools/m33_apply.py
      - tools/m33_finish.py
      - tools/m33_fixture.py
      - tools/m33_quickfix.py
      - tools/m33_harness_fix.py
      - .github/workflows/m33-integration-helper.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-ipc-service-foundation
          fetch-depth: 0
      - name: Apply deterministic M33 integration patches
        run: |
          python3 tools/m33_apply.py
          python3 tools/m33_finish.py
          python3 tools/m33_quickfix.py
          python3 tools/m33_harness_fix.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/m33_fixture.py')
          text = p.read_text()
          old = '''    if text.count(old) != 1:
                  raise SystemExit(f"fixture anchor mismatch {path}: {text.count(old)} {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))
          '''
          new = '''    count = text.count(old)
              if count != 1:
                  duplicate_cleanup = "        free(memory_test_bytes);\\n        free(input_test_bytes);"
                  if (old == duplicate_cleanup) and (count == 2):
                      p.write_text(text.replace(old, new, 2))
                      return
                  raise SystemExit(f"fixture anchor mismatch {path}: {count} {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))
          '''
          if text.count(old) != 1:
              raise SystemExit('m33_fixture rep helper anchor mismatch')
          p.write_text(text.replace(old, new, 1))
          PY
          python3 tools/m33_fixture.py
          git restore tools/m33_fixture.py
          git restore .github/workflows/boot-test.yml
      - name: Commit generated integration changes
        run: |
          if git diff --quiet; then
            echo 'No integration changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply M33 fixture integration'
          git push origin HEAD:agent/native-ipc-service-foundation
