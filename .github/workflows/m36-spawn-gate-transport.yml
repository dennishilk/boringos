name: M36 real spawn QEMU gate transport

on:
  push:
    branches: [agent/native-boring-terminal]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  real-spawn-qemu:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/native-boring-terminal

      - name: Verify staging ancestry and reconstruct exact gate patch
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 4d93197f2b40719036b86ada14d99d03d4e051d4 HEAD
          test -f .github/m36-spawn-gate.patch.part00
          test -f .github/m36-spawn-gate.patch.part01
          test -f .github/m36-spawn-gate.patch.part02
          cat .github/m36-spawn-gate.patch.part00 \
              .github/m36-spawn-gate.patch.part01 \
              .github/m36-spawn-gate.patch.part02 > /tmp/m36-spawn-gate.patch
          echo '4c81c6e3c0bacbf6fe5b01491847f7fab4a684ad7b30710b1c04194377098179  /tmp/m36-spawn-gate.patch' | sha256sum -c -
          git apply --check /tmp/m36-spawn-gate.patch
          git apply /tmp/m36-spawn-gate.patch

      - name: Install exact QEMU build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils curl xorriso qemu-system-x86

      - name: Run real Scheduler Ring3 BoringFS PTY SPAWN gate
        run: sh ./tests/m36-spawn-qemu.sh

      - name: Publish normal tested feature commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/m36-spawn-gate.patch.part00 \
                .github/m36-spawn-gate.patch.part01 \
                .github/m36-spawn-gate.patch.part02 \
                .github/workflows/m36-spawn-gate-transport.yml
          git add -A
          test ! -e .github/m36-spawn-gate.patch.part00
          test ! -e .github/m36-spawn-gate.patch.part01
          test ! -e .github/m36-spawn-gate.patch.part02
          test ! -e .github/workflows/m36-spawn-gate-transport.yml
          git config user.name 'Dennis Hilk'
          git config user.email '81433681+dennishilk@users.noreply.github.com'
          git commit -m 'M36: add real Ring3 PTY SPAWN QEMU gate'
          git push origin HEAD:agent/native-boring-terminal
