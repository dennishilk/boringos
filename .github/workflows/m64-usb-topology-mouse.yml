name: M64 USB topology mouse

on:
  push:
    branches: [agent/m64-usb-topology-mouse]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mixed-qemu-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install focused QEMU dependencies
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 xorriso
      - name: Mixed controller diagnostic only
        run: ./tests/m64-multi-usb-qemu.sh
