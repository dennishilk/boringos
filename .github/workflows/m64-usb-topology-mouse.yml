name: M64 USB topology mouse

on:
  push:
    branches: [agent/m64-usb-topology-mouse]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase-a-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install focused QEMU dependencies
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 xorriso
      - name: Multi-xHCI host/model acceptance
        run: make xhci-host-test
      - name: Sanitized xHCI host/model acceptance
        run: |
          mkdir -p build
          cc -Ikernel/include -std=c11 -fno-builtin \
            -Wall -Wextra -Wpedantic -Werror -Wconversion -Wshadow \
            -Wstrict-prototypes -Wmissing-prototypes \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/xhci-host-test.c kernel/core/xhci.c kernel/core/usb_hid.c \
            -o build/xhci-host-test-sanitized
          ASAN_OPTIONS=detect_leaks=0 ./build/xhci-host-test-sanitized
      - name: Real q35 xHCI controller regression
        run: ./tests/m48-xhci-qemu.sh
      - name: Real three-controller q35 ownership
        run: ./tests/m64-multi-xhci-qemu.sh
      - name: Cross-controller storage and HID
        id: multi_usb
        continue-on-error: true
        run: ./tests/m64-multi-usb-qemu.sh
      - name: Diagnose guest initialization failure
        if: steps.multi_usb.outcome == 'failure'
        continue-on-error: true
        run: |
          grep -Eq 'M64 multi-USB FAILED: (three-controller initialization|controller registry state|per-controller address/descriptor/HID|QEMU topology classification)' build/m64-multi-usb/serial.log && exit 1 || exit 0
      - name: Diagnose storage setup failure
        if: steps.multi_usb.outcome == 'failure'
        continue-on-error: true
        run: |
          grep -Eq 'M64 multi-USB FAILED: (controller-bound usb0 initialization|usb0 ownership/registration|usb0 bounded geometry|usb0 READ\(10\) before write)' build/m64-multi-usb/serial.log && exit 1 || exit 0
      - name: Diagnose storage transport failure
        if: steps.multi_usb.outcome == 'failure'
        continue-on-error: true
        run: |
          grep -Eq 'M64 multi-USB FAILED: (WRITE\(10\)/flush/readback|M63 normal flush policy regression|storage/HID Event Ring ownership)' build/m64-multi-usb/serial.log && exit 1 || exit 0
      - name: Diagnose canonical input setup failure
        if: steps.multi_usb.outcome == 'failure'
        continue-on-error: true
        run: |
          grep -Eq 'M64 multi-USB FAILED: (canonical input queue ownership|canonical input queue stats)' build/m64-multi-usb/serial.log && exit 1 || exit 0
      - name: Diagnose HID Interrupt-IN failure
        if: steps.multi_usb.outcome == 'failure'
        continue-on-error: true
        run: |
          grep -Fq 'M64 multi-USB FAILED: cross-controller HID Interrupt-IN' build/m64-multi-usb/serial.log && exit 1 || exit 0
      - name: Diagnose canonical input result failure
        if: steps.multi_usb.outcome == 'failure'
        continue-on-error: true
        run: |
          grep -Eq 'M64 multi-USB FAILED: (canonical cross-controller input end state|canonical cross-controller input read|canonical keyboard/pointer event classes|canonical input release)' build/m64-multi-usb/serial.log && exit 1 || exit 0
      - name: Preserve cross-controller gate
        if: steps.multi_usb.outcome == 'failure'
        run: exit 1
