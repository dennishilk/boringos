name: M64 USB topology mouse

on:
  push:
    branches: [agent/m64-usb-topology-mouse]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase-a-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install focused QEMU dependencies
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 xorriso
      - name: Multi-xHCI host/model acceptance
        run: make xhci-host-test
      - name: Sanitized xHCI host/model acceptance
        run: |
          mkdir -p build
          cc -Ikernel/include -std=c11 -fno-builtin \
            -Wall -Wextra -Wpedantic -Werror -Wconversion -Wshadow \
            -Wstrict-prototypes -Wmissing-prototypes \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/xhci-host-test.c kernel/core/xhci.c kernel/core/usb_hid.c \
            -o build/xhci-host-test-sanitized
          ASAN_OPTIONS=detect_leaks=0 ./build/xhci-host-test-sanitized
      - name: Real q35 xHCI controller regression
        run: ./tests/m48-xhci-qemu.sh
      - name: Real three-controller q35 ownership
        run: ./tests/m64-multi-xhci-qemu.sh
      - name: Cross-controller storage and HID
        id: multi_usb
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p build
          set +e
          ./tests/m64-multi-usb-qemu.sh 2>&1 | tee build/m64-multi-usb-step.log
          status=${PIPESTATUS[0]}
          echo "$status" > build/m64-multi-usb-step.status
          exit "$status"
      - name: Witness test image built
        if: steps.multi_usb.outcome == 'failure'
        continue-on-error: true
        run: test -s build/boringos.iso
      - name: Witness guest serial created
        if: steps.multi_usb.outcome == 'failure'
        continue-on-error: true
        run: test -s build/m64-multi-usb/serial.log
      - name: Witness HID injection window reached
        if: steps.multi_usb.outcome == 'failure'
        continue-on-error: true
        run: grep -Fq 'M64 multi-controller HID ready; inject real USB input now.' build/m64-multi-usb/serial.log
      - name: Witness guest cross-controller PASS reached
        if: steps.multi_usb.outcome == 'failure'
        continue-on-error: true
        run: grep -Fq 'M64 multi-controller USB storage/HID passed.' build/m64-multi-usb/serial.log
      - name: Witness all guest acceptance markers
        if: steps.multi_usb.outcome == 'failure'
        continue-on-error: true
        run: |
          for marker in \
            'KEYBOARD_ON_CONTROLLER_A=PASS' \
            'STORAGE_ON_CONTROLLER_A=PASS' \
            'HID_ON_CONTROLLER_B=PASS' \
            'USB_STORAGE_REGRESSION=PASS' \
            'M63_FLUSH_POLICY_REGRESSION=PASS' \
            'CROSS_CONTROLLER_EVENT_OWNERSHIP=PASS' \
            'CROSS_CONTROLLER_HID_INTERRUPT_IN=PASS' \
            'CANONICAL_MOUSE_EVENT_ON_CONTROLLER_B=PASS'; do
            grep -Fq "$marker" build/m64-multi-usb/serial.log || exit 1
          done
      - name: Witness storage target sector changed
        if: steps.multi_usb.outcome == 'failure'
        continue-on-error: true
        run: |
          python3 - <<'PY'
          from pathlib import Path
          before=Path('build/m64-multi-usb/m64-usb.before.raw').read_bytes()
          after=Path('build/m64-multi-usb/m64-usb.raw').read_bytes()
          block=512; start=8*block; end=start+block
          assert len(before)==len(after)
          assert before[start:end] != after[start:end]
          PY
      - name: Witness storage writes bounded to target sector
        if: steps.multi_usb.outcome == 'failure'
        continue-on-error: true
        run: |
          python3 - <<'PY'
          from pathlib import Path
          before=Path('build/m64-multi-usb/m64-usb.before.raw').read_bytes()
          after=Path('build/m64-multi-usb/m64-usb.raw').read_bytes()
          block=512; start=8*block; end=start+block
          assert before[:start] == after[:start]
          assert before[end:] == after[end:]
          PY
      - name: Preserve cross-controller gate
        if: steps.multi_usb.outcome == 'failure'
        run: exit 1
