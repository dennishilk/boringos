name: M64 USB topology mouse

on:
  push:
    branches: [agent/m64-usb-topology-mouse]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase-a-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install focused QEMU dependencies
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 xorriso
      - name: Multi-xHCI host/model acceptance
        run: make xhci-host-test
      - name: Sanitized xHCI host/model acceptance
        run: |
          mkdir -p build
          cc -Ikernel/include -std=c11 -fno-builtin \
            -Wall -Wextra -Wpedantic -Werror -Wconversion -Wshadow \
            -Wstrict-prototypes -Wmissing-prototypes \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/xhci-host-test.c kernel/core/xhci.c kernel/core/usb_hid.c \
            -o build/xhci-host-test-sanitized
          ASAN_OPTIONS=detect_leaks=0 ./build/xhci-host-test-sanitized
      - name: Real q35 xHCI controller regression
        run: ./tests/m48-xhci-qemu.sh
      - name: Real three-controller q35 ownership
        run: ./tests/m64-multi-xhci-qemu.sh
      - name: Cross-controller storage and HID
        id: multi_usb
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p build
          set +e
          ./tests/m64-multi-usb-qemu.sh 2>&1 | tee build/m64-multi-usb-step.log
          status=${PIPESTATUS[0]}
          echo "$status" > build/m64-multi-usb-step.status
          exit "$status"
      - name: Diagnose build failure
        if: steps.multi_usb.outcome == 'failure'
        continue-on-error: true
        run: |
          grep -Eq '(error:|undefined reference|No rule to make target|make: \*\*\*)' build/m64-multi-usb-step.log && exit 1 || exit 0
      - name: Diagnose pre-input guest exit
        if: steps.multi_usb.outcome == 'failure'
        continue-on-error: true
        run: |
          grep -Fq 'QEMU exited before HID injection' build/m64-multi-usb-step.log && exit 1 || exit 0
      - name: Diagnose HID injection window timeout
        if: steps.multi_usb.outcome == 'failure'
        continue-on-error: true
        run: |
          grep -Fq 'guest did not reach HID injection window' build/m64-multi-usb-step.log && exit 1 || exit 0
      - name: Diagnose QMP injection failure
        if: steps.multi_usb.outcome == 'failure'
        continue-on-error: true
        run: |
          grep -Fq 'QMP USB input injection failed' build/m64-multi-usb-step.log && exit 1 || exit 0
      - name: Diagnose post-input guest exit
        if: steps.multi_usb.outcome == 'failure'
        continue-on-error: true
        run: |
          grep -Fq 'QEMU exited before PASS' build/m64-multi-usb-step.log && exit 1 || exit 0
      - name: Diagnose guest acceptance timeout
        if: steps.multi_usb.outcome == 'failure'
        continue-on-error: true
        run: |
          grep -Fq 'guest acceptance timed out' build/m64-multi-usb-step.log && exit 1 || exit 0
      - name: Diagnose missing witness
        if: steps.multi_usb.outcome == 'failure'
        continue-on-error: true
        run: |
          grep -Fq 'missing marker:' build/m64-multi-usb-step.log && exit 1 || exit 0
      - name: Diagnose persistence verifier failure
        if: steps.multi_usb.outcome == 'failure'
        continue-on-error: true
        run: |
          grep -Eq '(image length changed|target sector did not change|bytes outside target sector changed)' build/m64-multi-usb-step.log && exit 1 || exit 0
      - name: Diagnose guest explicit failure
        if: steps.multi_usb.outcome == 'failure'
        continue-on-error: true
        run: |
          grep -Fq 'M64 multi-USB FAILED:' build/m64-multi-usb/serial.log && exit 1 || exit 0
      - name: Preserve cross-controller gate
        if: steps.multi_usb.outcome == 'failure'
        run: exit 1
