name: M58 high-memory PMM

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  high-memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install focused QEMU dependencies
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 xorriso
      - name: PMM high-memory host boundaries
        run: make pmm-readiness-host-test
      - name: Sanitized PMM high-memory fixtures
        run: |
          mkdir -p build
          cc -Ikernel/include -std=c11 -fno-builtin -fno-tree-loop-distribute-patterns \
            -Wall -Wextra -Wpedantic -Werror -Wconversion -Wshadow \
            -Wstrict-prototypes -Wmissing-prototypes \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/pmm-readiness-host-test.c kernel/core/pmm.c \
            -o build/pmm-readiness-host-test-sanitized
          ASAN_OPTIONS=detect_leaks=0 ./build/pmm-readiness-host-test-sanitized
      - name: Real 32 GiB q35 high-frame acceptance
        run: sh tests/m58-high-memory-qemu.sh
