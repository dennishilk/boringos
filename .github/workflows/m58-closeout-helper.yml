name: M58 closeout helper

on:
  push:
    branches:
      - agent/m58-high-memory-pmm

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/m58-high-memory-pmm
          fetch-depth: 0

      - name: Prepare temporary closeout helper copy
        run: sed 's#i8042/PS2#i8042/PS/2#g' scripts/m58-closeout.py > /tmp/m58-closeout.py

      - name: Protect historical M57 version witness
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/roadmap.md')
          text = p.read_text()
          old = 'Active version after runtime-neutral closeout: **BoringKernel 0.0.58-dev**. No\nM58 implementation is included.'
          new = 'Active version after runtime-neutral closeout: **__M57_VERSION_WITNESS__**. No\nM58 implementation is included.'
          if text.count(old) != 1:
              raise SystemExit('historical M57 version witness mismatch')
          p.write_text(text.replace(old, new, 1))
          PY

      - name: Apply runtime-neutral closeout
        run: python3 /tmp/m58-closeout.py

      - name: Restore historical M57 version witness
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/roadmap.md')
          text = p.read_text()
          old = 'Active version after runtime-neutral closeout: **__M57_VERSION_WITNESS__**. No\nM58 implementation is included.'
          new = 'Active version after runtime-neutral closeout: **BoringKernel 0.0.58-dev**. No\nM58 implementation is included.'
          if text.count(old) != 1:
              raise SystemExit('historical M57 version restore mismatch')
          p.write_text(text.replace(old, new, 1))
          PY

      - name: Remove temporary closeout helpers
        run: |
          git rm .github/workflows/m58-closeout-helper.yml scripts/m58-closeout.py
          git diff --check

      - name: Commit final M58 closeout
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md README.de.md docs/roadmap.md docs/m58-high-memory-pmm.md kernel/core/entry.c
          git commit -m 'M58: runtime-neutral closeout to 0.0.59-dev'
          git push origin HEAD:agent/m58-high-memory-pmm
