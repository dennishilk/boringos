name: M58 one-shot runtime-neutral closeout helper

on:
  push:
    branches:
      - agent/m58-high-memory-pmm

permissions:
  contents: write

jobs:
  closeout:
    if: github.event.head_commit.message == 'M58: stage runtime-neutral closeout helper'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/m58-high-memory-pmm
          fetch-depth: 0

      - name: Apply bounded M58 closeout witnesses
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "kernel/core/entry.c",
              'serial_write_string("BoringKernel 0.0.58-dev\\n");',
              'serial_write_string("BoringKernel 0.0.59-dev\\n");')

          replace_once("README.md", "BoringKernel 0.0.58-dev", "BoringKernel 0.0.59-dev")
          replace_once("README.md", "Development is complete through **Milestone 57**.",
                       "Development is complete through **Milestone 58**.")
          replace_once(
              "README.md",
              "Milestone 47 established an honest real-hardware readiness boundary. Valid memory maps larger than the PMM's fixed capacity no longer abort boot, but the current PMM still manages at most **1,048,576 4-KiB frames = 4 GiB**. Excess usable RAM is reported as capped and left unmanaged for now.",
              "Milestone 58 removes the old ~4-GiB PMM development ceiling for the bounded reference target. The existing PMM now has capacity for **8,388,608 4-KiB frames = 32 GiB**, and real QEMU `-m 32G` acceptance proves usable memory above 4 GiB plus a managed physical frame at `0x0000000100000000`. Maps beyond the configured 32-GiB PMM capacity remain explicitly bounded/capped rather than implying arbitrary-scale memory support.")
          replace_once(
              "README.md",
              "| Managed RAM | currently capped at 4 GiB; larger valid maps are accepted |",
              "| Managed RAM | bounded 32-GiB PMM capacity; real 32-GiB QEMU maps and frames >= 4 GiB are verified |")
          replace_once(
              "README.md",
              "At this README revision, **M52 is complete** and the next modern-input step is **M53: USB HID integration with the existing BoringOS input queue**. A later milestone may then prove the complete graphical desktop without i8042/PS2 before work continues toward a deliberately safe physical-PC/live-boot path.",
              "At this README revision, **M58 is complete** and the active development banner is **BoringKernel 0.0.59-dev**. M59 is not part of this closeout; the exact next milestone remains defined by the roadmap rather than being started here.")

          replace_once("README.de.md", "BoringKernel 0.0.58-dev", "BoringKernel 0.0.59-dev")
          replace_once("README.de.md", "Die Entwicklung ist bis einschließlich **Milestone 57** abgeschlossen.",
                       "Die Entwicklung ist bis einschließlich **Milestone 58** abgeschlossen.")
          replace_once(
              "README.de.md",
              "Milestone 47 hat eine ehrliche Real-Hardware-Readiness-Grenze geschaffen. Gültige Memory Maps, die größer als die feste PMM-Kapazität sind, brechen den Boot nicht mehr ab. Der aktuelle PMM verwaltet aber weiterhin höchstens **1.048.576 4-KiB-Frames = 4 GiB**. Darüber hinaus vorhandener nutzbarer RAM wird als gecappt gemeldet und vorerst nicht verwaltet.",
              "Milestone 58 entfernt die alte ~4-GiB-Entwicklungsgrenze des PMM für das begrenzte Referenzziel. Der bestehende PMM besitzt jetzt Kapazität für **8.388.608 4-KiB-Frames = 32 GiB**, und eine reale QEMU-`-m 32G`-Acceptance beweist nutzbaren Speicher oberhalb 4 GiB sowie einen verwalteten physischen Frame bei `0x0000000100000000`. Maps jenseits der konfigurierten 32-GiB-PMM-Kapazität bleiben bewusst begrenzt/gecappt; daraus wird kein beliebig skalierender Memory-Support abgeleitet.")
          replace_once(
              "README.de.md",
              "| Verwalteter RAM | aktuell auf 4 GiB begrenzt; größere gültige Maps werden akzeptiert |",
              "| Verwalteter RAM | begrenzte 32-GiB-PMM-Kapazität; reale 32-GiB-QEMU-Maps und Frames >= 4 GiB sind verifiziert |")
          replace_once(
              "README.de.md",
              "Zum Zeitpunkt dieser README-Aktualisierung ist **M52 abgeschlossen**. Der nächste moderne Input-Schritt ist **M53: USB-HID-Integration in die bestehende BoringOS-Inputqueue**. Ein späterer Milestone kann anschließend den vollständigen grafischen Desktop ohne i8042/PS2 beweisen, bevor der bewusst sichere physische PC-/Live-Boot-Pfad weitergeht.",
              "Zum Zeitpunkt dieser README-Aktualisierung ist **M58 abgeschlossen** und der aktive Entwicklungsbanner lautet **BoringKernel 0.0.59-dev**. M59 ist nicht Teil dieses Closeouts; der exakte nächste Milestone wird erst durch die Roadmap festgelegt und hier nicht begonnen.")

          replace_once("docs/roadmap.md", "BoringKernel 0.0.58-dev", "BoringKernel 0.0.59-dev")
          roadmap = Path("docs/roadmap.md")
          text = roadmap.read_text()
          marker = "## Milestone 58: bounded high-memory PMM / >4 GiB physical memory — COMPLETE, Semantic Frozen"
          if marker in text:
              raise SystemExit("docs/roadmap.md: M58 section already exists")
          text += """


## Milestone 58: bounded high-memory PMM / >4 GiB physical memory — COMPLETE, Semantic Frozen

M58 extends the existing bounded 4-KiB PMM without replacing its architecture.
The static capacity is now 8,388,608 frames (32 GiB) with a derived 1-MiB bitmap,
64-bit frame/address/accounting state, checked region arithmetic and explicit
bitmap/index bounds. A small `pmm_alloc_frame_in_range()` constraint provides the
minimum-address high-frame proof and the low-address DMA guard needed by existing
device paths; the ordinary allocator remains the same deterministic bounded PMM.

The VMM/HHDM path already handled physical addresses above 4 GiB with checked
64-bit page-table and HHDM arithmetic, so M58 requires no VMM runtime change.
AHCI preserves its existing `CAP.S64A` behavior: 64-bit-capable controllers may
use the full PMM range, while non-S64A DMA allocations are constrained below
4 GiB. The existing xHCI path is conservatively constrained below 4 GiB rather
than assuming an unproven 64-bit DMA capability. No DMA subsystem rewrite was
introduced.

Host PMM acceptance covers exactly below/at/above 4 GiB, the 32-GiB boundary,
the last valid bitmap frame, one-past rejection, region accumulation, malformed
and overflowing ranges, cap behavior beyond the configured maximum, constrained
allocation, invalid/unaligned/unusable free and double-free rejection under the
existing sanitizer architecture.

Real QEMU acceptance run `33258288429` booted q35 with `-m 32G` using a shared
sparse file-backed main-RAM backend solely to fit the GitHub hosted runner. The
guest still receives a real 32-GiB physical memory map. Exact runtime evidence:

```text
M58 PMM usable bytes: 34354872320
M58 PMM usable frames: 8387420
M58 high frame: 0x0000000100000000
M58 high frame >= 4GiB: PASS
M58 high frame write/read: PASS
M58 neighboring frame isolation: PASS
M58 high frame free: PASS
M58 accounting: PASS
M58 cleanup: PASS
M58 HIGH MEMORY TEST PASSED
```

Semantic Freeze: `f6c6feff137f4ab36c41d26a5f14f7d6391dee19`, tree
`70937b4b5b43c0e87ee016175302dbba03f62955`. All 23 exact feature-head workflow
runs were terminal SUCCESS before closeout, including M54 USB-only graphical
desktop, M57 writable AHCI persistent root, M58 focused acceptance and complete
Boot #668 / `33258288413`.

Active version after runtime-neutral closeout: **BoringKernel 0.0.59-dev**. No
M59 implementation is included.
See [m58-high-memory-pmm.md](m58-high-memory-pmm.md).
"""
          roadmap.write_text(text)

          Path("docs/m58-high-memory-pmm.md").write_text("""# M58 — bounded high-memory PMM / >4 GiB physical memory

M58 removes the original ~4-GiB PMM development ceiling without replacing the
existing allocator architecture. BoringKernel remains deliberately bounded and
simple: 4-KiB frames, a static bitmap and deterministic allocation semantics.

## Implemented bound

- maximum managed frame count: 8,388,608
- frame size: 4 KiB
- configured PMM capacity: 32 GiB
- bitmap size: 8,388,608 bits = 1,048,576 bytes
- physical addresses, frame counters and byte counters remain 64-bit
- bitmap/frame indices and memory-map region arithmetic are checked before use

M58 adds `pmm_alloc_frame_in_range(minimum, maximum_exclusive, out)` as the
smallest generic constrained-allocation primitive needed for a bounded real
high-frame test and DMA-address limits. It is not a zone allocator, buddy
allocator or replacement PMM architecture.

## Real 32-GiB acceptance

Permanent workflow run `33258288429` boots real QEMU q35 with `-m 32G`. A shared
sparse file-backed main-RAM backend avoids the hosted runner's anonymous-memory
commit limit; it does not reduce guest-visible RAM.

Observed evidence from the guest:

```text
M58 PMM usable bytes: 34354872320
M58 PMM usable frames: 8387420
M58 high frame: 0x0000000100000000
M58 high frame >= 4GiB: PASS
M58 high frame write/read: PASS
M58 neighboring frame isolation: PASS
M58 high frame free: PASS
M58 accounting: PASS
M58 cleanup: PASS
M58 HIGH MEMORY TEST PASSED
```

The test allocates a real physical frame at or above 4 GiB without exhausting
millions of lower frames, accesses it through the established HHDM mapping,
checks deterministic first/last-byte patterns, verifies that an adjacent frame
is unchanged, frees both frames and requires PMM accounting to return exactly to
the pre-test state.

## DMA safety

AHCI keeps its established `CAP.S64A` contract. If S64A is present, DMA storage
may come from the full PMM range; otherwise AHCI requests frames below 4 GiB.
The existing xHCI path is conservatively kept below 4 GiB so a larger PMM cannot
silently feed it a high DMA address before 64-bit controller support is proven.
All programmed DMA address fields remain untruncated.

## Preserved boundaries

M58 does not add NUMA, huge pages, swapping, a page-cache redesign, SMP memory
policy, a new heap allocator, NVMe, USB mass storage, networking, partitioning or
physical-PC acceptance. The PMM is still statically bounded to 32 GiB rather than
being an arbitrary-scale enterprise allocator. SMBIOS installed memory and PMM
usable/free memory remain separate system-information concepts.

Runtime Semantic Freeze:

```text
SHA:  f6c6feff137f4ab36c41d26a5f14f7d6391dee19
tree: 70937b4b5b43c0e87ee016175302dbba03f62955
```

All 23 permanent feature-head workflows were SUCCESS at freeze, including the
USB-only graphical desktop, writable AHCI persistent root and complete Boot #668.
""")
          PY

          git diff --check
          python3 - <<'PY'
          import subprocess
          expected = {
              'README.md',
              'README.de.md',
              'docs/m58-high-memory-pmm.md',
              'docs/roadmap.md',
              'kernel/core/entry.c',
          }
          changed = set(subprocess.check_output(
              ['git', 'status', '--short'], text=True).splitlines())
          paths = {line[3:] for line in changed}
          if paths != expected:
              raise SystemExit(f'unexpected closeout path set: {sorted(paths)}')
          PY

      - name: Commit runtime-neutral closeout
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md README.de.md docs/roadmap.md docs/m58-high-memory-pmm.md kernel/core/entry.c
          git commit -m 'M58: runtime-neutral closeout to 0.0.59-dev'
          git push origin HEAD:agent/m58-high-memory-pmm
