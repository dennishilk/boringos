name: M22 entry integration patch

on:
  push:
    branches:
      - agent/virtio-block

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/virtio-block
      - name: Wire VirtIO block test mode
        shell: python
        run: |
          from pathlib import Path

          path = Path('kernel/core/entry.c')
          text = path.read_text()

          replacements = [
              (
                  '#include <boring/vfs_test.h>\n#include <boring/vmm.h>\n',
                  '#include <boring/vfs_test.h>\n#include <boring/virtio_blk_test.h>\n#include <boring/vmm.h>\n',
              ),
              (
                  '#define BORING_TEST_MODE_BLOCK 11\n#define IRQ_TEST_TICKS',
                  '#define BORING_TEST_MODE_BLOCK 11\n#define BORING_TEST_MODE_VIRTIO_BLOCK 12\n#define IRQ_TEST_TICKS',
              ),
              (
                  '    (BORING_TEST_MODE != BORING_TEST_MODE_SHELL) && \\\n    (BORING_TEST_MODE != BORING_TEST_MODE_BLOCK)\n#error',
                  '    (BORING_TEST_MODE != BORING_TEST_MODE_SHELL) && \\\n    (BORING_TEST_MODE != BORING_TEST_MODE_BLOCK) && \\\n    (BORING_TEST_MODE != BORING_TEST_MODE_VIRTIO_BLOCK)\n#error',
              ),
              (
                  '#elif BORING_TEST_MODE == BORING_TEST_MODE_BLOCK\n    block_device_test_run();\n#endif',
                  '#elif BORING_TEST_MODE == BORING_TEST_MODE_BLOCK\n    block_device_test_run();\n#elif BORING_TEST_MODE == BORING_TEST_MODE_VIRTIO_BLOCK\n    virtio_blk_test_run();\n#endif',
              ),
          ]

          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one match for {old!r}, got {text.count(old)}')
              text = text.replace(old, new, 1)

          path.write_text(text)

          workflow = Path('.github/workflows/m22-entry-patch.yml')
          workflow.unlink()
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kernel/core/entry.c .github/workflows/m22-entry-patch.yml
          git commit -m "Wire VirtIO block test mode"
          git push origin HEAD:agent/virtio-block
