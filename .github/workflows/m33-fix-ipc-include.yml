name: M33 temporary IPC include fix

on:
  workflow_dispatch:
  push:
    branches:
      - agent/native-ipc-service-foundation
    paths:
      - .github/workflows/m33-fix-ipc-include.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-ipc-service-foundation
          fetch-depth: 0
      - name: Add missing syscall ABI include
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('kernel/core/ipc.c')
          s = p.read_text()
          old = '#include <boring/process.h>\n#include <boring/task.h>\n'
          new = '#include <boring/process.h>\n#include <boring/syscall_abi.h>\n#include <boring/task.h>\n'
          if '#include <boring/syscall_abi.h>' not in s:
              if s.count(old) != 1:
                  raise SystemExit('ipc include anchor mismatch')
              s = s.replace(old, new, 1)
              p.write_text(s)
          PY
      - name: Commit source fix
        run: |
          if git diff --quiet; then
            echo 'No source change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kernel/core/ipc.c
          git commit -m 'Fix M33 IPC buffer sentinel include'
          git push origin HEAD:agent/native-ipc-service-foundation
