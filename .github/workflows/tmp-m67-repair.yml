name: Temporary M67 repair

on:
  push:
    branches:
      - agent/m67-m69-input-display-polish

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m67-m69-input-display-polish
      - name: Apply narrow M67 timer repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('kernel/core/event_syscall.c')
          s = p.read_text()

          service = '            const bool serviced = xhci_service_hid_reports(&usb_state);\n'
          preemptible = '            x86_64_interrupts_enable();\n' + service
          if preemptible not in s:
              if service not in s:
                  raise SystemExit('xHCI service anchor missing')
              s = s.replace(service, preemptible, 1)

          start_marker = (
              '            /*\n'
              '             * USB HID is normally polled cooperatively without depending on\n'
          )
          end_marker = (
              '            /*\n'
              '             * The yield can run a peer that makes any watched object ready.\n'
          )
          replacement = (
              '            /*\n'
              '             * Keep cooperative xHCI polling preemptible by the PIT.\n'
              '             * Typematic is clocked by timer IRQs in the transport-neutral\n'
              '             * input core; never turn the proven M54/M66 polling path into\n'
              '             * an HLT wait on an unrelated interrupt.\n'
              '             */\n'
              '            task_yield();\n\n'
          )
          if start_marker in s:
              start = s.index(start_marker)
              end = s.index(end_marker, start)
              s = s[:start] + replacement + s[end:]
          elif replacement not in s:
              raise SystemExit('event wait repair anchor missing')
          p.write_text(s)

          p = Path('kernel/core/m37_desktop_test.c')
          s = p.read_text()
          anchor = '#include <boring/task.h>\n#include <boring/user_memory.h>\n'
          fixed = '#include <boring/task.h>\n#include <boring/timer.h>\n#include <boring/user_memory.h>\n'
          if fixed not in s:
              if anchor not in s:
                  raise SystemExit('timer include anchor missing')
              s = s.replace(anchor, fixed, 1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kernel/core/event_syscall.c kernel/core/m37_desktop_test.c
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'M67: keep cooperative HID timer-preemptible'
          git push origin HEAD:agent/m67-m69-input-display-polish
