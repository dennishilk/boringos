name: M45 real SMBIOS platform identity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smbios:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Install build and QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils xorriso qemu-system-x86 python3
      - name: Bounded parser and actual SMBIOS identity in two firmware configurations
        run: python3 tests/m45-smbios-qemu.py
      - name: Upload actual guest SMBIOS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boringos-m45-smbios-reference
          path: build/m45-smbios-reference/
          if-no-files-found: error
          retention-days: 30
