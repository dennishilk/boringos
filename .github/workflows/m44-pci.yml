name: M44 real PCI inventory

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Install build and QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils xorriso qemu-system-x86 python3
      - name: Actual PCI inventory and full VirtIO I/O persistence correlation
        run: python3 tests/m44-pci-qemu.py
      - name: Upload actual guest PCI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boringos-m44-pci-reference
          path: build/m44-pci-reference/
          if-no-files-found: error
          retention-days: 30
