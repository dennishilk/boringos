name: M36 graphical desktop QEMU gate transport

on:
  push:
    branches: [agent/native-boring-terminal]

permissions:
  contents: write

jobs:
  graphical-desktop-qemu:
    if: "${{ github.event.head_commit.message == 'M36: stage graphical desktop QEMU gate' }}"
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/native-boring-terminal
          fetch-depth: 0

      - name: Verify staging ancestry and reconstruct exact desktop patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "65ce343efff3ab0547c35192a5ab98c93175e966"
          cat .github/m36-desktop.patch.part00 \
              .github/m36-desktop.patch.part01 \
              .github/m36-desktop.patch.part02 > /tmp/m36-desktop.patch
          echo '1fe71f0861fc31d233bde39624b402419c8b965c9a4f24bf2f43fe8628bc5e35  /tmp/m36-desktop.patch' | sha256sum -c -
          git apply --check /tmp/m36-desktop.patch
          git apply /tmp/m36-desktop.patch

      - name: Install exact QEMU build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils curl xorriso qemu-system-x86

      - name: Run targeted M36 desktop prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sh tests/m36-bundle-test.sh
          make terminal-host-test terminal-render-host-test wm-host-test
          sh tests/terminal-build-audit.sh
          python3 -m py_compile tests/m36-desktop-qemu.py tests/validate-m36-terminal-screenshot.py

      - name: Run real graphical QMP terminal acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/m36-desktop-qemu.py

      - name: Upload graphical M36 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m36-graphical-terminal-evidence
          path: |
            build/m36-desktop-reference/
            build/m36-bundle-test/geometry.txt
            build/m36-bundle-test/SHA256SUMS
          if-no-files-found: warn

      - name: Publish normal tested feature commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/m36-desktop.patch.part00 \
                .github/m36-desktop.patch.part01 \
                .github/m36-desktop.patch.part02 \
                .github/workflows/m36-desktop-gate-transport.yml
          test ! -e .github/m36-desktop.patch.part00
          test ! -e .github/m36-desktop.patch.part01
          test ! -e .github/m36-desktop.patch.part02
          test ! -e .github/workflows/m36-desktop-gate-transport.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'M36: prove graphical terminal desktop path'
          git push origin HEAD:agent/native-boring-terminal
