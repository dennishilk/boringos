name: M36 semantic foundation reconstruction

on:
  push:
    branches: [agent/native-boring-terminal]

permissions:
  contents: write

jobs:
  reconstruct:
    if: "${{ contains(github.event.head_commit.message, 'M36: stage semantic reconstruction transport') }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/native-boring-terminal
      - name: Reconstruct and verify foundation
        shell: bash
        run: |
          set -euo pipefail
          cat .github/m36-foundation.patch.part00 \
              .github/m36-foundation.patch.part01 \
              .github/m36-foundation.patch.part02 > /tmp/m36-foundation.patch
          echo '49870c340a006319bb4c6bad6738c3ddcabab352f16f6dc23d29aba73a70795e  /tmp/m36-foundation.patch' | sha256sum -c -
          git apply --check /tmp/m36-foundation.patch
          git apply /tmp/m36-foundation.patch

          test "$(git hash-object kernel/core/fd.c)" = 2beb870ddcbbd6e09bc4c04da4cab550ba4e243d
          test "$(git hash-object Makefile)" = 300617b187da7d1bd97fbcf7140a245f9d9fdf06
          test "$(git hash-object kernel/core/task.c)" = 36f04d5c04b478916ce36bd4a57e002500a12c48
          test "$(git hash-object kernel/core/m36_syscall.c)" = 412bc0615108255d77b23620ae3ef1ec3074b0eb
          test "$(git hash-object kernel/core/syscall.c)" = 5f86891013dea6caf61686e246de6395e529b0ac
          test "$(git hash-object user/boring-shell/main.c)" = 097ce8ece116f7bcffeccf8204f033f7a5737a99
          grep -Eq '^#define BORING_SYS_PTY_CREATE 42$' kernel/include/boring/syscall_abi.h
          grep -Eq '^#define BORING_SYS_SPAWN 43$' kernel/include/boring/syscall_abi.h
          grep -q 'boring_fd_write(BORING_FD_STDOUT' user/boringfetch/main.c

          make pty-host-test
          make fd-host-test
          make shell-host-test
          make user-shell
          make user-boringfetch
          make TEST_MODE=m35-wm build/kernel.elf

          cat > docs/m36-reconstruction-provenance.md <<'EOF'
          # M36 reconstruction provenance

          The M36 foundation was recovered after loss of the original local reconstruction workspace using two explicit provenance classes.

          - **Exact recovered:** `kernel/core/fd.c` is the previously verified Git blob `2beb870ddcbbd6e09bc4c04da4cab550ba4e243d`. Other already-published M36 source whose complete Git object was retained remains exact recovered.
          - **Semantically reconstructed after workspace loss:** `Makefile`, `kernel/core/task.c`, `kernel/core/m36_syscall.c`, `kernel/core/syscall.c`, and `user/boring-shell/main.c` were reconstructed from the documented M36 contract because the original complete bytes were no longer provable.

          The semantically reconstructed blobs at this checkpoint are:

          - `Makefile`: `300617b187da7d1bd97fbcf7140a245f9d9fdf06`
          - `kernel/core/task.c`: `36f04d5c04b478916ce36bd4a57e002500a12c48`
          - `kernel/core/m36_syscall.c`: `412bc0615108255d77b23620ae3ef1ec3074b0eb`
          - `kernel/core/syscall.c`: `5f86891013dea6caf61686e246de6395e529b0ac`
          - `user/boring-shell/main.c`: `097ce8ece116f7bcffeccf8204f033f7a5737a99`

          This checkpoint does **not** claim byte identity with lost commit `79e1fedcee2be57691d9b5576e633a54b2941f0c`. Its validity is established by the retained ABI contract, freestanding target builds, targeted host tests, real QEMU acceptance, historical regressions, and later permanent CI. The final M36 Semantic Freeze, not the lost intermediate commit, becomes the immutable source of truth.
          EOF

          rm -f .github/m36-foundation.patch.part00 \
                .github/m36-foundation.patch.part01 \
                .github/m36-foundation.patch.part02 \
                .github/workflows/m36-foundation-reconstruct.yml

          git add -A
          test -z "$(git diff --cached --name-only | grep -E '^\.github/m36-foundation\.patch|^\.github/workflows/m36-foundation-reconstruct\.yml$' || true)"
          git config user.name 'Dennis Hilk'
          git config user.email '81433681+dennishilk@users.noreply.github.com'
          git commit -m 'M36: complete reconstructed spawn foundation'
          git push origin HEAD:agent/native-boring-terminal
