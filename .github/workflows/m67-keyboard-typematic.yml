name: M67 keyboard typematic

on:
  pull_request:
  push:
    branches: [agent/m67-m69-input-display-polish]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typematic:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install focused QEMU dependencies
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 xorriso
      - name: Static acceptance checks
        run: |
          git diff --check
          python3 -m py_compile tests/m54-usb-only-desktop-qemu.py
          printf 'M67_HEAD=%s\nM67_TREE=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')"
      - name: Deterministic typematic host/model acceptance
        run: make input-host-test
      - name: Sanitized typematic host/model acceptance
        run: |
          mkdir -p build
          cc -Ikernel/include -std=c11 -fno-builtin             -Wall -Wextra -Wpedantic -Werror -Wconversion -Wshadow             -Wstrict-prototypes -Wmissing-prototypes             -fsanitize=address,undefined -fno-omit-frame-pointer             tests/input-host-test.c kernel/core/input.c             kernel/arch/x86_64/ps2_keyboard.c kernel/arch/x86_64/ps2_mouse.c             -o build/input-host-test-sanitized
          ASAN_OPTIONS=detect_leaks=0 ./build/input-host-test-sanitized
      - name: Held Backspace and shortcut suppression in real USB desktop
        run: M67_TYPEMATIC=1 python3 tests/m54-usb-only-desktop-qemu.py
      - name: M53 USB HID canonical input regression
        run: ./tests/m53-usb-input-qemu.sh
      - name: M54 USB graphical desktop regression
        run: python3 tests/m54-usb-only-desktop-qemu.py
      - name: M64 multi-xHCI host/model regression
        run: make xhci-host-test
      - name: M64 three-controller ownership regression
        run: ./tests/m64-multi-xhci-qemu.sh
      - name: M64 cross-controller storage and HID regression
        run: ./tests/m64-multi-usb-qemu.sh
      - name: M65 hub downstream mouse regression
        run: ./tests/m65-usb-hub-mouse-qemu.sh
      - name: M66 hub mouse Ring3 desktop regression
        run: python3 tests/m66-usb-hub-desktop-qemu.py
