name: M32 integration patch

on:
  push:
    branches:
      - agent/userspace-memory-shared-buffers

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out M32 branch
        uses: actions/checkout@v4
        with:
          ref: agent/userspace-memory-shared-buffers
          fetch-depth: 0

      - name: Apply exact bounded integration edits
        run: |
          set -euo pipefail
          python3 tests/m32-integrate.py
          git diff --check

      - name: Commit integrated M32 wiring
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kernel user tests Makefile .github/workflows/boot-test.yml
          git diff --cached --check
          git diff --cached --quiet && { echo 'no integration changes produced' >&2; exit 1; }
          git commit -m 'Integrate M32 memory shared buffers and acceptance'
          git push origin HEAD:agent/userspace-memory-shared-buffers
