name: M52 runtime-neutral closeout helper

on:
  push:
    branches: [agent/m52-xhci-hid-interrupt-in]
    paths: [.github/workflows/m52-closeout-helper.yml]

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m52-xhci-hid-interrupt-in
          fetch-depth: 3
      - name: Verify exact freeze-documentation anchor
        run: |
          test "$(git rev-parse HEAD^)" = "26682d8364a5e561399b888a4b57a097d29372ac"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/m52-closeout-helper.yml"
      - name: Apply bounded version closeout
        shell: bash
        run: |
          files='README.de.md README.md kernel/core/boringfs_ro_test.c kernel/core/entry.c kernel/core/syscall.c tests/block-device-qemu.sh tests/boot-qemu.sh tests/boringfetch-host-test.c tests/boringfs-ro-qemu.sh tests/boringfs-rw-qemu.sh tests/console-qemu.sh tests/elf-qemu.sh tests/exception-divide-qemu.sh tests/exception-pagefault-qemu.sh tests/framebuffer-qemu.sh tests/init-qemu.sh tests/m36-spawn-qemu.sh tests/m48-xhci-qemu.sh tests/m49-xhci-address-qemu.sh tests/m52-xhci-hid-qemu.sh tests/persistent-root-qemu.sh tests/ramfs-qemu.sh tests/ring3-qemu.sh tests/runtime-qemu.sh tests/shell-host-test.c tests/shell-qemu.sh tests/syscall-qemu.sh tests/validate-m36-terminal-screenshot.py tests/vfs-qemu.sh tests/virtio-block-qemu.sh'
          count=0
          for f in $files; do
            grep -q '0\.0\.52-dev' "$f"
            sed -i 's/0\.0\.52-dev/0.0.53-dev/g' "$f"
            count=$((count + 1))
          done
          test "$count" -eq 30
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/roadmap.md')
          s = p.read_text()
          old = 'The accepted development banner is now:\n\n```text\nBoringKernel 0.0.52-dev\n```'
          new = 'The accepted development banner is now:\n\n```text\nBoringKernel 0.0.53-dev\n```'
          if s.count(old) != 1:
              raise SystemExit('roadmap active banner is not uniquely 0.0.52-dev')
          if '## Milestone 52: real xHCI HID interrupt-IN report transport' in s:
              raise SystemExit('M52 roadmap section already present')
          s = s.replace(old, new, 1)
          s += '''\n\n## Milestone 52: real xHCI HID interrupt-IN report transport — COMPLETE, Semantic Frozen\n\nM52 takes M51-configured direct-root-port HID Interrupt-IN endpoints through real xHCI Normal-TRB report transfers and real Transfer Events. Each endpoint uses bounded PMM-owned report DMA, producer-cycle tracking, Link-TRB ring wrap, exact slot/DCI/TRB-pointer/completion validation, residual-length accounting and bounded re-arm. Keyboard Boot reports and the observed six-byte QEMU absolute-tablet report are decoded only after controller completion. No input-queue delivery, desktop USB input, hubs, storage or M53 semantics are included.\n\nSemantic Freeze: `bc00930901c218cb6409a686a19a898d20233ebb`, tree `d25179a63df620741606ecfb24381813921db12c`. Focused real-QEMU acceptance run `33231871215` proved four Interrupt-IN submissions, three real Transfer completions, 22 report bytes and three decoded reports, including an `A` press/release and absolute pointer position 12345 x 23456. Observed slots, endpoint IDs, lengths and counts are evidence only. All 17 PR workflows on the frozen runtime head were terminal SUCCESS before closeout.\n\nActive version after runtime-neutral closeout: **BoringKernel 0.0.53-dev**. No M53 implementation is included.\nSee [m52-xhci-hid-reports.md](m52-xhci-hid-reports.md).\n'''
          p.write_text(s)

          p = Path('docs/m52-xhci-hid-reports.md')
          s = p.read_text()
          marker = 'Active version after runtime-neutral closeout: **BoringKernel 0.0.53-dev**.'
          if marker in s:
              raise SystemExit('M52 closeout marker already present')
          p.write_text(s + '\n\n## Semantic Freeze and closeout\n\nRuntime implementation freeze: `bc00930901c218cb6409a686a19a898d20233ebb`, tree `d25179a63df620741606ecfb24381813921db12c`. All 17 PR workflows on that exact runtime head were terminal SUCCESS. After the freeze, only M52 documentation and the established active-version witnesses may change.\n\n' + marker + '\nNo M53 implementation is included.\n')
          PY
          git rm .github/workflows/m52-closeout-helper.yml
          expected=$(printf '%s\n' .github/workflows/m52-closeout-helper.yml docs/m52-xhci-hid-reports.md docs/roadmap.md $files | sort)
          actual=$(git diff HEAD --name-only | sort)
          test "$actual" = "$expected"
          git diff --check HEAD
      - name: Commit runtime-neutral closeout
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'M52: runtime-neutral closeout and advance version'
          git push origin HEAD:agent/m52-xhci-hid-interrupt-in
