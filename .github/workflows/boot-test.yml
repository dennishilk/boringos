name: BoringKernel boot test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  boot-qemu:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build and QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils curl xorriso qemu-system-x86

      - name: Audit generated ELF userspace artifact
        run: sh ./tests/elf-build-audit.sh

      - name: Standalone boringfetch build audit
        run: sh ./tests/boringfetch-build-audit.sh

      - name: Standalone cat ELF audit
        run: sh ./tests/cat-build-audit.sh

      - name: Audit generated native C runtime artifact
        run: sh ./tests/runtime-build-audit.sh

      - name: Audit generated console userspace artifact
        run: sh ./tests/console-build-audit.sh

      - name: Normal boot, hardware IRQ, cooperative and preemptive scheduling
        run: ./tests/boot-qemu.sh

      - name: Real divide exception
        run: ./tests/exception-divide-qemu.sh

      - name: Real page fault exception
        run: ./tests/exception-pagefault-qemu.sh

      - name: Real Ring 3 transition and privileged-operation fault
        run: ./tests/ring3-qemu.sh

      - name: Real SYSCALL and SYSRETQ boundary
        run: ./tests/syscall-qemu.sh

      - name: Real ELF boot-module load and userspace execution
        run: sh ./tests/elf-qemu.sh

      - name: Real native C userspace runtime execution
        run: sh ./tests/runtime-qemu.sh

      - name: Real userspace serial console I/O
        run: sh ./tests/console-qemu.sh

      - name: Build VFS test mode
        run: make TEST_MODE=vfs

      - name: Filesystem-independent VFS core
        run: sh ./tests/vfs-qemu.sh

      - name: Build RAMFS test mode
        run: make TEST_MODE=ramfs

      - name: Real RAMFS backend
        run: sh ./tests/ramfs-qemu.sh

      - name: Audit generated boring-init artifact
        run: sh ./tests/init-build-audit.sh

      - name: Build boring-init test mode
        run: make TEST_MODE=init

      - name: Real first userspace process boring-init
        run: sh ./tests/init-qemu.sh

      - name: Audit generated boring-shell artifact
        run: sh ./tests/shell-build-audit.sh

      - name: Bounded shell editor and completion host tests
        run: make shell-host-test

      - name: Native descriptor host tests
        run: make fd-host-test

      - name: Native framebuffer renderer host tests
        run: make framebuffer-host-test

      - name: Build boring-shell test mode
        run: make TEST_MODE=shell

      - name: Real interactive boring-shell
        run: sh ./tests/shell-qemu.sh

      - name: ANSI line editing history and completion
        run: sh ./tests/shell-editing-qemu.sh

      - name: Shell exit wait reap and respawn lifecycle
        run: sh ./tests/shell-lifecycle-qemu.sh

      - name: Shell input pacing and burst stress
        run: sh ./tests/shell-input-stress-qemu.sh

      - name: Generic bounded block-device layer
        run: sh ./tests/block-device-qemu.sh

      - name: Modern VirtIO block device
        run: sh ./tests/virtio-block-qemu.sh

      - name: Read-only BoringFS over VirtIO
        run: sh ./tests/boringfs-ro-qemu.sh

      - name: Writable BoringFS reboot persistence
        run: sh ./tests/boringfs-rw-qemu.sh

      - name: Persistent BoringFS root human boot
        run: sh ./tests/persistent-root-qemu.sh

      - name: Native descriptor and standalone cat verification
        run: sh ./tests/fd-stdio-qemu.sh

      - name: Real Limine framebuffer and BoringOS dashboard
        run: sh ./tests/framebuffer-qemu.sh

      - name: Upload validated framebuffer reference
        uses: actions/upload-artifact@v4
        with:
          name: boringos-framebuffer-reference
          path: build/framebuffer-reference.ppm
          if-no-files-found: error

      - name: Writable BoringFS allocation and rollback matrix
        run: make boringfs-vfs-host-test

      - name: BoringFS v0 codec and structural validator
        run: make boringfs-host-test

      - name: Deterministic mkboringfs formatter
        run: make mkboringfs-test

      - name: Read-only boringfsck inspector
        run: make boringfsck-test

      - name: Build human-runnable QEMU bundle
        run: make qemu-bundle

      - name: Upload human-runnable QEMU bundle
        uses: actions/upload-artifact@v4
        with:
          name: boringos-qemu-x86_64
          path: build/boringos-qemu-x86_64/
          if-no-files-found: error
