name: BoringKernel boot test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  boot-qemu:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build and QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils curl xorriso qemu-system-x86

      - name: Boot and verify BoringKernel
        run: ./tests/boot-qemu.sh
