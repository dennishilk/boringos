name: BoringKernel boot test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  boot-qemu:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build and QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils curl xorriso qemu-system-x86

      - name: M35 native BoringWM host ELF input lifecycle and visual acceptance
        run: sh ./tests/wm-qemu.sh

      - name: Upload M35 real framebuffer and lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boringos-m35-wm-reference
          path: |
            build/m35-wm-reference/
            build/m35-wm-death/
          if-no-files-found: error

      - name: Audit generated ELF userspace artifact
        run: sh ./tests/elf-build-audit.sh

      - name: Standalone boringfetch build audit
        run: sh ./tests/boringfetch-build-audit.sh

      - name: Standalone cat ELF audit
        run: sh ./tests/cat-build-audit.sh

      - name: Standalone input-test ELF audit
        run: sh ./tests/input-test-build-audit.sh

      - name: Standalone memory-test ELF audit
        run: sh ./tests/memory-test-build-audit.sh

      - name: Standalone ipc-test ELF audit
        run: sh ./tests/ipc-test-build-audit.sh

      - name: Standalone M34 display service and client ELF audits
        run: sh ./tests/display-build-audit.sh

      - name: Audit generated native C runtime artifact
        run: sh ./tests/runtime-build-audit.sh

      - name: Audit generated console userspace artifact
        run: sh ./tests/console-build-audit.sh

      - name: Normal boot, hardware IRQ, cooperative and preemptive scheduling
        run: ./tests/boot-qemu.sh

      - name: Real divide exception
        run: ./tests/exception-divide-qemu.sh

      - name: Real page fault exception
        run: ./tests/exception-pagefault-qemu.sh

      - name: Real Ring 3 transition and privileged-operation fault
        run: ./tests/ring3-qemu.sh

      - name: Real SYSCALL and SYSRETQ boundary
        run: ./tests/syscall-qemu.sh

      - name: Real ELF boot-module load and userspace execution
        run: sh ./tests/elf-qemu.sh

      - name: Real native C userspace runtime execution
        run: sh ./tests/runtime-qemu.sh

      - name: Real userspace serial console I/O
        run: sh ./tests/console-qemu.sh

      - name: Build VFS test mode
        run: make TEST_MODE=vfs

      - name: Filesystem-independent VFS core
        run: sh ./tests/vfs-qemu.sh

      - name: Build RAMFS test mode
        run: make TEST_MODE=ramfs

      - name: Real RAMFS backend
        run: sh ./tests/ramfs-qemu.sh

      - name: Audit generated boring-init artifact
        run: sh ./tests/init-build-audit.sh

      - name: Build boring-init test mode
        run: make TEST_MODE=init

      - name: Real first userspace process boring-init
        run: sh ./tests/init-qemu.sh

      - name: Audit generated boring-shell artifact
        run: sh ./tests/shell-build-audit.sh

      - name: Bounded shell editor and completion host tests
        run: make shell-host-test

      - name: Native descriptor host tests
        run: make fd-host-test

      - name: Native framebuffer renderer host tests
        run: make framebuffer-host-test

      - name: Native input decoder and queue host tests
        run: make input-host-test

      - name: M32 userspace memory shared-buffer and runtime heap host tests
        run: make memory-host-test

      - name: M33 bounded service registry IPC and grant host tests
        run: make ipc-host-test

      - name: M34 bounded display protocol and compositor host tests
        run: make display-host-test

      - name: Build boring-shell test mode
        run: make TEST_MODE=shell

      - name: Real interactive boring-shell
        run: sh ./tests/shell-qemu.sh

      - name: ANSI line editing history and completion
        run: sh ./tests/shell-editing-qemu.sh

      - name: Shell exit wait reap and respawn lifecycle
        run: sh ./tests/shell-lifecycle-qemu.sh

      - name: Shell input pacing and burst stress
        run: sh ./tests/shell-input-stress-qemu.sh

      - name: Generic bounded block-device layer
        run: sh ./tests/block-device-qemu.sh

      - name: Modern VirtIO block device
        run: sh ./tests/virtio-block-qemu.sh

      - name: Read-only BoringFS over VirtIO
        run: sh ./tests/boringfs-ro-qemu.sh

      - name: Writable BoringFS reboot persistence
        run: sh ./tests/boringfs-rw-qemu.sh

      - name: Persistent BoringFS root human boot
        run: sh ./tests/persistent-root-qemu.sh

      - name: Native descriptor and standalone cat verification
        run: sh ./tests/fd-stdio-qemu.sh

      - name: Real PS/2 keyboard and mouse userspace input
        run: sh ./tests/input-qemu.sh

      - name: Real userspace memory allocation and shared buffers
        run: sh ./tests/memory-qemu.sh

      - name: Real three-process native IPC service and M32 capability grants
        id: m33_ipc_qemu
        run: sh ./tests/ipc-qemu.sh

      - name: Upload M33 IPC failure diagnostics
        if: ${{ failure() && steps.m33_ipc_qemu.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: m33-ipc-failure-diagnostics
          path: build/m33-ipc-diagnostics/
          if-no-files-found: error

      - name: Real Limine framebuffer and BoringOS dashboard
        run: sh ./tests/framebuffer-qemu.sh

      - name: Upload validated framebuffer reference
        uses: actions/upload-artifact@v4
        with:
          name: boringos-framebuffer-reference
          path: build/framebuffer-reference.ppm
          if-no-files-found: error

      - name: Real three-process native boring-display with QMP mouse
        id: m34_display_qemu
        run: sh ./tests/display-qemu.sh

      - name: Upload M34 display failure diagnostics
        if: ${{ failure() && steps.m34_display_qemu.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: m34-display-failure-diagnostics
          path: build/m34-display-diagnostics/
          if-no-files-found: error

      - name: Upload validated M34 display reference
        uses: actions/upload-artifact@v4
        with:
          name: boringos-m34-display-reference
          path: build/m34-display-reference.ppm
          if-no-files-found: error

      - name: Writable BoringFS allocation and rollback matrix
        run: make boringfs-vfs-host-test

      - name: BoringFS v0 codec and structural validator
        run: make boringfs-host-test

      - name: Deterministic mkboringfs formatter
        run: make mkboringfs-test

      - name: Read-only boringfsck inspector
        run: make boringfsck-test

      - name: M34 BoringFS bundle geometry and exact contents
        run: sh ./tests/m34-bundle-test.sh

      - name: Build human-runnable M34 QEMU bundle
        run: sh ./tests/build-m34-qemu-bundle.sh

      - name: M35 BoringFS geometry exact contents and dual QEMU bundle
        run: sh ./tests/build-m35-qemu-bundle.sh

      - name: Upload human-runnable QEMU bundle
        uses: actions/upload-artifact@v4
        with:
          name: boringos-qemu-x86_64
          path: build/boringos-qemu-x86_64/
          if-no-files-found: error

  m36-terminal:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build and QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils curl xorriso qemu-system-x86

      - name: Bounded PTY stack parser renderer and input host regressions
        run: make pty-host-test fd-host-test shell-host-test spawn-stack-host-test terminal-host-test terminal-render-host-test

      - name: Freestanding terminal ELF and measured BoringFS contents
        run: |
          sh ./tests/m36-bundle-test.sh
          sh ./tests/terminal-build-audit.sh
          sh ./tests/shell-build-audit.sh
          sh ./tests/boringfetch-build-audit.sh

      - name: Real Scheduler Ring3 PTY SPAWN stdio wait and detached reap
        run: sh ./tests/m36-spawn-qemu.sh

      - name: Real graphical prompt boringfetch dual focus and graceful close
        run: python3 ./tests/m36-desktop-qemu.py

      - name: Reject corrupted actual framebuffer evidence
        run: python3 ./tests/m36-oracle-test.py

      - name: Unexpected terminal exit peer cleanup and independent survivor
        run: python3 ./tests/m36-desktop-qemu.py --mode terminal-death

      - name: Shell exit PTY HUP cleanup and independent survivor
        run: python3 ./tests/m36-desktop-qemu.py --mode shell-death

      - name: Upload M36 actual framebuffer and lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boringos-m36-terminal-reference
          path: |
            build/m36-spawn-reference/
            build/m36-desktop-reference/
            build/m36-terminal-death/
            build/m36-shell-death/
          if-no-files-found: error

      - name: Build human-runnable M36 graphical terminal bundle
        run: sh ./tests/build-m36-qemu-bundle.sh

      - name: Reboot exact M36 bundle images without rebuilding
        run: python3 ./tests/m36-desktop-qemu.py --bundle build/boringos-m36-qemu-x86_64

      - name: Upload M36 bundle reboot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boringos-m36-bundle-reboot
          path: build/m36-bundle-reboot/
          if-no-files-found: error

      - name: Upload human-runnable M36 graphical terminal bundle
        uses: actions/upload-artifact@v4
        with:
          name: boringos-m36-qemu-x86_64
          path: build/boringos-m36-qemu-x86_64/
          if-no-files-found: error
