name: BoringKernel boot test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  boot-qemu:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Normal boot, hardware timer IRQ and cooperative contexts
        run: ./tests/boot-qemu.sh

      - name: Real divide exception
        run: ./tests/exception-divide-qemu.sh

      - name: Real page fault exception
        run: ./tests/exception-pagefault-qemu.sh
