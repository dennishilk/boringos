name: M56 production wiring once

on:
  push:
    branches:
      - agent/m56-ahci-readonly-block

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m56-ahci-readonly-block
          fetch-depth: 0
      - name: Wire M56 production sources atomically
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          p = Path('Makefile')
          s = p.read_text()
          needle = '\tkernel/core/block_device.c \\\n'
          assert s.count(needle) == 1
          s = s.replace(needle, needle + '\tkernel/core/ahci_block.c \\\n')
          needle = '\tkernel/drivers/virtio_blk.c \\\n'
          assert s.count(needle) == 1
          s = s.replace(needle, '\tkernel/drivers/ahci_block.c \\\n' + needle)
          p.write_text(s)

          p = Path('kernel/include/boring/ahci_block.h')
          s = p.read_text()
          needle = '#include <boring/io.h>\n'
          assert s.count(needle) == 1
          p.write_text(s.replace(needle, ''))

          p = Path('kernel/drivers/ahci_block.c')
          s = p.read_text()
          needle = '#include <boring/cpu.h>\n'
          assert s.count(needle) == 1
          p.write_text(s.replace(needle, needle + '#include <boring/io.h>\n'))

          p = Path('tests/m56-ahci-readonly-qemu.sh')
          s = p.read_text()
          old = "HARNESS='kernel/core/ahci.c kernel/arch/x86_64/ahci_hw.c kernel/core/ahci_block.c kernel/drivers/ahci_block.c kernel/core/ahci_block_test.c kernel/core/ahci_block_test_adapter.c'"
          new = "HARNESS='kernel/core/ahci.c kernel/arch/x86_64/ahci_hw.c kernel/core/ahci_block_test.c kernel/core/ahci_block_test_adapter.c'"
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          PY
          git rm .github/workflows/m56-wire-once.yml
          git diff --check
          test "$(grep -Fc 'kernel/core/ahci_block.c' Makefile)" -eq 1
          test "$(grep -Fc 'kernel/drivers/ahci_block.c' Makefile)" -eq 1
          ! grep -Fq 'kernel/core/ahci_block.c kernel/drivers/ahci_block.c' tests/m56-ahci-readonly-qemu.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Makefile kernel/include/boring/ahci_block.h kernel/drivers/ahci_block.c tests/m56-ahci-readonly-qemu.sh
          git commit -m 'M56: wire read-only AHCI path into kernel build'
          git push origin HEAD:agent/m56-ahci-readonly-block
