name: M23 apply implementation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/boringfs-readonly-mount'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/boringfs-readonly-mount
          fetch-depth: 0
      - name: Apply exact M23 implementation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -c 'import base64,json,os,urllib.request; sha="36c6f940d8ce8e6edf2ea5256bc96c6c84cada85"; req=urllib.request.Request("https://api.github.com/repos/dennishilk/boringos/git/blobs/"+sha,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"}); data=json.load(urllib.request.urlopen(req)); open("/tmp/m23.tar.xz","wb").write(base64.b64decode(data["content"]))'
          tar -xJf /tmp/m23.tar.xz -C .
          rm -f .github/workflows/m23-source-snapshot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Milestone 23: mount read-only BoringFS over VirtIO"
          git push origin HEAD:agent/boringfs-readonly-mount
