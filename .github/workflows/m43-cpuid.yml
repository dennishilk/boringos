name: M43 real CPUID inventory

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpuid:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Install build and QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils xorriso qemu-system-x86 python3
      - name: Real CPUID collection with two CPU configurations and normal boot
        run: python3 tests/m43-cpuid-qemu.py
      - name: Upload actual guest CPUID evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boringos-m43-cpuid-reference
          path: build/m43-cpuid-reference/
          if-no-files-found: error
          retention-days: 30
